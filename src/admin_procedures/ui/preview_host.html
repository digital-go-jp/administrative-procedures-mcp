<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>apcli</title>
<style>
/* base.css (DADS デザイントークン + セマンティックトークン + コンポーネント) を
 * サーバーがここへインライン注入する。以下のスタイルはそのトークンのみを参照する。
 * 公式トークンのみを使用し、ロゴ等のブランド要素は用いない。 */
/* INLINE_BASE_CSS */

/* --- プレビューホスト固有のレイアウト (base.css のトークンを使用) --- */
/* 白基調で表示する (OS がダークモードでもライト固定)。
 * DADS ライトのセマンティックトークンを無条件で再宣言して dark メディアより優先させる。 */
:root {
  --bg: #ffffff; --bg-alt: #f2f2f2;
  --text: #1a1a1a; --text-muted: #767676;
  --border: #cccccc; --border-strong: #666666;
  --accent: #0017c1; --accent-light: #e8f1fe;
  --green: #259d63; --green-bg: #e6f5ec;
  --yellow: #b78f00; --yellow-bg: #fbf5e0;
  --red: #ec0000; --red-bg: #fdeeee;
  color-scheme: light;
}
/* base.css の 14px はダッシュボード (iframe 内) の高密度表示向け。
 * このページは会話 UI なので DADS の Std-17N-170 相当 (17px / 行間 170%) で
 * ゆったり表示する。補足テキストの下限は 14px を厳守。 */
html { font-size: 17px; }
html, body { height: 100%; }
body {
  display: flex;
  flex-direction: column;
  padding: 0;  /* base.css の本文パディングはチャットレイアウトでは用いない */
  line-height: 1.7;
}
/* DADS フォーカスインジケーター: 黒 4px アウトライン + 黄 (yellow-300) 2px リング
 * (公式実装 design-system-example-components の仕様どおり) */
:focus-visible,
#input:focus {
  outline: 4px solid #000000;
  outline-offset: 2px;
  box-shadow: 0 0 0 2px #ffd43d;
}

/* --- サイドバー付きレイアウト (Claude/ChatGPT ライク) --- */
#layout { flex: 1; display: flex; min-height: 0; }
#sidebar {
  width: 250px; flex-shrink: 0;
  border-right: 1px solid var(--border);
  padding: 16px 12px;
  overflow-y: auto;
  display: flex; flex-direction: column; gap: 10px;
  background: var(--bg);
}
#new-session {
  width: 100%; min-height: 48px; font-size: 0.9375rem;
  background: var(--bg); border: 1px solid var(--border-strong);
  border-radius: var(--radius); cursor: pointer;
}
#new-session:hover { background: var(--accent-light); }
#session-list { display: flex; flex-direction: column; gap: 2px; }
.session-item {
  display: flex; align-items: center; border-radius: var(--radius);
}
.session-item:hover { background: var(--bg-alt); }
.session-item.active { background: var(--accent-light); }
.session-item .session-open {
  flex: 1; min-width: 0; text-align: left;
  border: none; background: none; cursor: pointer;
  min-height: 44px; padding: 8px 10px; font-size: 0.875rem;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.session-item .session-del {
  border: none; background: none; cursor: pointer;
  min-height: 44px; min-width: 40px; padding: 0 8px;
  color: var(--text-muted); font-size: 0.875rem;
}
.session-item .session-del:hover { color: var(--red); }
/* 狭い画面ではサイドバーをオーバーレイ (引き出し) として表示する。
 * display:none で固定してしまうとハンバーガーが無反応に見える。 */
#sidebar-backdrop { display: none; }
#close-sidebar { display: none; }
@media (max-width: 900px) {
  #sidebar {
    position: fixed; top: 0; left: 0; bottom: 0; z-index: 40;
    width: min(280px, 85vw);
    box-shadow: 4px 0 24px rgba(0, 0, 0, 0.15);
  }
  body:not(.sidebar-closed) #sidebar-backdrop {
    display: block; position: fixed; inset: 0; z-index: 39;
    background: rgba(0, 0, 0, 0.4); border: none; padding: 0; cursor: pointer;
  }
  #close-sidebar {
    display: flex; align-items: center; justify-content: center;
    align-self: flex-end; min-width: 44px; min-height: 44px;
    border: none; background: none; cursor: pointer;
    color: var(--text-muted); border-radius: var(--radius);
  }
  #close-sidebar:hover { background: var(--bg-alt); }
}
body.sidebar-closed #sidebar { display: none; }
#main-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#chat-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  font-weight: 700;
  font-size: 0.875rem;
}
#chat-close {
  border: none;
  background: none;
  cursor: pointer;
  color: var(--text-muted);
  padding: 0;
  min-width: 24px;
  min-height: 24px;
}

#update-banner {
  display: flex; align-items: center; gap: 16px;
  padding: 8px 24px;
  background: var(--yellow-bg);
  border-bottom: 1px solid var(--yellow);
  font-size: 0.875rem;
}
#update-banner button { min-height: 36px; padding: 2px 16px; font-size: 0.875rem; }
#toggle-sidebar {
  border: none; background: none; cursor: pointer;
  min-width: 44px; min-height: 44px; font-size: 1.125rem;
  color: var(--text-muted); border-radius: var(--radius);
}
#toggle-sidebar:hover { background: var(--bg-alt); }
.sidebar-spacer { flex: 1; }
/* 探索フローの折りたたみ */
details.discovery { align-self: flex-start; width: 100%; }
details.discovery > summary {
  cursor: pointer; color: var(--text-muted); font-size: 0.875rem;
  min-height: 44px; display: flex; align-items: center; padding: 0 4px;
}
details.discovery .tool-card { margin: 8px 0; }
header {
  border-bottom: 1px solid var(--border);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
}
header h1 { font-size: 1rem; margin: 0; font-weight: 700; }
header .sub { color: var(--text-muted); font-size: 0.875rem; }
/* ステータスランプ: 緑=利用可 / 黄=ダウンロード関連 / 赤=利用不可 / グレー=確認中。
 * 詳細は title / aria-label に持たせ、表示はドットのみ (シンプルファースト) */
#lm-status {
  margin-left: auto;
  display: flex; align-items: center;
  color: var(--border-strong);
  position: relative;
  flex-shrink: 0;
}
#lm-status.ok { color: var(--green); }
#lm-status.warn { color: #ffd43d; }  /* yellow-300 */
#lm-status.err { color: var(--red); }
/* マウスオーバーで状態の詳細を表示 */
#lm-status:hover::after {
  content: attr(data-tip);
  position: absolute; right: 0; top: calc(100% + 8px);
  background: var(--text); color: var(--bg);
  padding: 6px 12px; border-radius: 6px;
  font-size: 0.875rem; white-space: nowrap; z-index: 20;
}

/* ── チャットレイアウト (一般的なチャット UI の文法に従う) ──
 * ユーザー = 右寄せの吹き出し (accent)、AI = 左寄せの吹き出し (bg-alt)、
 * メタ情報 (ヒント・差し戻し等) は左寄せの小さな注記。 */
#chat {
  flex: 1;
  overflow-y: auto;
  padding: 48px 32px;
  display: flex;
  flex-direction: column;
  gap: 24px;
  width: 100%;
  max-width: 840px;
  margin: 0 auto;
}
#chat > * { width: 100%; }
.msg { padding: 14px 22px; white-space: pre-wrap; word-break: break-word; line-height: 1.8; }
.msg.user {
  background: var(--accent);
  color: var(--bg);
  border-radius: 14px 14px 4px 14px;
  width: fit-content;
  max-width: 80%;
  align-self: flex-end;
}
.msg.assistant {
  background: var(--bg-alt);
  border-radius: 14px 14px 14px 4px;
  width: fit-content;
  max-width: 90%;
  align-self: flex-start;
}
.msg.note {
  background: none; color: var(--text-muted);
  font-size: 0.875rem; text-align: left; padding: 0 4px;
  align-self: flex-start; max-width: 90%;
}
.msg.error {
  background: var(--red-bg); border: 1px solid var(--red); color: var(--red);
  font-size: 0.875rem; border-radius: 14px;
  width: fit-content; max-width: 90%; align-self: flex-start;
}
/* 進行ステップ: パンくず1行 (a › b › c)。クリックで下に詳細展開 */
.turn-steps { align-self: flex-start; max-width: 100%; font-size: 0.875rem; color: var(--text-muted); }
.steps-line { display: flex; flex-wrap: wrap; align-items: center; min-height: 32px; padding: 0 4px; }
.steps-line .sep { margin: 0 8px; color: var(--border); }
.steps-line .seg.running::after {
  content: "…";
  animation: thinking-dots 1.2s infinite;
}
.steps-line .seg.has-detail { cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.steps-line .seg.has-detail:hover { color: var(--accent); }
.steps-line .seg.active { color: var(--accent); font-weight: 700; }
.step-detail {
  margin: 4px 0 8px 4px; padding: 8px 12px;
  max-height: 240px; overflow: auto;
  font-family: var(--font-family-mono); font-size: 0.875rem;
  background: var(--bg-alt); border-radius: 8px;
  white-space: pre-wrap; word-break: break-all;
}
@keyframes thinking-dots {
  0% { opacity: 0.2; }
  50% { opacity: 1; }
  100% { opacity: 0.2; }
}
/* ターン境界線は eval 実行中のみ表示 (ケースの区切りを明示するため) */
.turn-sep { display: none; }
body.eval-running .turn-sep {
  display: block;
  border-top: 2px solid var(--border-strong);
  margin-top: 16px;
  opacity: 0.6;
}
body.eval-running .turn-sep:first-child { display: none; }

/* ツール実行は枠なし: 「name — クエリ内容」の小さな1行 + UI (細枠) + 詳細 */
.tool-card { border: none; }
.tool-card .tc-head {
  display: flex; align-items: baseline; gap: 8px;
  padding: 0 4px;
  font-size: 0.875rem; color: var(--text-muted);
  flex-wrap: wrap;
}
.tool-card .tc-name { font-family: var(--font-family-mono); font-weight: 700; }
.tool-card .tc-query { word-break: break-word; }
.tool-card .tc-query::before { content: "—"; margin-right: 8px; color: var(--border); }
.tool-card .tc-state { margin-left: auto; white-space: nowrap; }
.tool-card .tc-args {
  margin: 0; padding: 8px 12px;
  font-family: var(--font-family-mono); font-size: 0.875rem;
  white-space: pre-wrap; word-break: break-all;
  background: var(--bg-alt); border-radius: 8px;
  max-height: 160px; overflow: auto;
}
.tool-card .tc-fix {
  padding: 4px 12px; font-size: 0.875rem; color: var(--text-muted);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.tool-card iframe {
  display: block; width: 100%; height: 340px;
  background: var(--bg);
  border: 1px solid var(--border); border-radius: 8px;
  margin-top: 6px;
}
.tool-card details { font-size: 0.875rem; }
.tool-card details summary {
  padding: 4px; cursor: pointer; color: var(--text-muted);
  display: inline-block;
}
.tool-card pre {
  margin: 4px 0; padding: 8px 12px; max-height: 240px; overflow: auto;
  font-family: var(--font-family-mono); font-size: 0.875rem;
  background: var(--bg-alt); border-radius: 8px;
  white-space: pre-wrap; word-break: break-all;
}

#bottom { border-top: 1px solid var(--border); padding: 16px 32px 24px; }
#bottom > * { max-width: 840px; margin: 0 auto; }
#composer { display: flex; gap: 8px; }
/* DADS インプットテキスト/ボタン準拠: 入力・主要ボタンは高さ 48px (Medium)、
 * ターゲット領域 44px 以上を確保。本文 16px。 */
/* DADS インプットテキスト準拠: 高さ lg=56px、ボーダー solid-gray-600、
 * hover で黒、角丸 8px */
#input {
  flex: 1; resize: none; padding: 12px 16px;
  border: 1px solid var(--border-strong); border-radius: 8px;
  background: #ffffff; color: var(--text);
  font-family: inherit; font-size: 1rem;
  min-height: 56px; max-height: 160px;
}
#input:hover:not(:disabled) { border-color: #000000; }
#input:disabled {
  background: var(--bg-alt);
  color: var(--text-muted);
  cursor: not-allowed;
  opacity: 0.6;
}
/* DADS ボタン準拠 (md: 高さ48px / 角丸8px)。
 * 既定はアウトライン (白地 + key-900)、.primary は塗り (key-900 → hover 1000 → active 1200) */
button {
  border: 1px solid currentColor; border-radius: 8px;
  background: #ffffff; color: var(--accent);
  min-height: 48px; padding: 8px 16px;
  font-size: 1rem; font-family: inherit; cursor: pointer;
}
button:hover { background: #c5d7fb; color: #00118f; }   /* key-200 / key-1000 */
button:active { background: #9db7f9; color: #000060; }  /* key-300 / key-1200 */
button:disabled {
  background: #ffffff; color: #cccccc; border-color: #cccccc;
  cursor: not-allowed;
}
button.primary {
  background: var(--accent); border-color: var(--accent);
  color: #ffffff; font-weight: 700; padding: 8px 24px;
}
button.primary:hover { background: #00118f; border-color: #00118f; color: #ffffff; }
button.primary:active { background: #000060; border-color: #000060; }
button.primary:disabled { background: #cccccc; border-color: #cccccc; color: #f2f2f2; }
#examples { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
#examples button {
  font-size: 0.875rem; min-height: 36px; padding: 2px 12px;
  border-radius: 6px; margin: 4px 0;  /* sm サイズ + ターゲット領域確保の余白 */
}

/* スマートフォン対応 */
@media (max-width: 768px) {
  #main-col { padding: 0; }
  #sidebar {
    position: fixed; top: 0; left: 0; bottom: 0; z-index: 40;
    width: min(280px, 85vw);
    box-shadow: 4px 0 24px rgba(0, 0, 0, 0.15);
  }
  body:not(.sidebar-closed) #sidebar-backdrop {
    display: block; position: fixed; inset: 0; z-index: 39;
    background: rgba(0, 0, 0, 0.4); border: none; padding: 0; cursor: pointer;
  }
  #close-sidebar {
    display: flex; align-items: center; justify-content: center;
    align-self: flex-end; min-width: 44px; min-height: 44px;
    border: none; background: none; cursor: pointer;
    color: var(--text-muted); border-radius: var(--radius);
  }
  #close-sidebar:hover { background: var(--bg-alt); }
  body.sidebar-closed #sidebar { display: none; }
  #chat {
    padding: 24px 16px;
    gap: 12px;
    max-width: 100%;
  }
  #bottom { padding: 12px 16px 16px; }
  #composer { flex-direction: column; }
  #input { min-height: 48px; }
}

/* フォローアップ提案 (回答の下に「次の一手」チップを出す) */
.followups {
  display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  margin: 4px 0 20px;
}
.followups .fu-label { font-size: 0.875rem; color: var(--text-muted); }
.followups button {
  font-size: 0.875rem; min-height: 36px; padding: 2px 12px;
  border-radius: 6px; margin: 4px 0;
}

#dl-banner {
  border-bottom: 1px solid var(--border);
  background: var(--accent-light);
  padding: 12px 20px;
  font-size: 1rem;
}
#dl-banner .dl-inner { max-width: 920px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
#dl-banner .dl-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
#dl-banner progress { flex: 1; min-width: 200px; height: 8px; accent-color: var(--accent); }
#dl-banner .dl-note { color: var(--text-muted); font-size: 0.875rem; }

#setup {
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px 20px; font-size: 1rem; background: var(--bg-alt);
}
#setup h2 { font-size: 1rem; margin: 0 0 6px; }
#setup ol { margin: 6px 0; padding-left: 20px; }
#setup code { font-family: var(--font-family-mono); font-size: 0.875rem; background: var(--bg); padding: 1px 6px; border-radius: 4px; }
</style>
</head>
<body>
<header>
  <button type="button" id="toggle-sidebar" aria-label="サイドバーを開閉"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <h1>apcli</h1>
  <span id="lm-status">内蔵 AI を確認中…</span>
</header>

<div id="dl-banner" hidden>
  <div class="dl-inner">
    <div id="dl-text"></div>
    <div class="dl-row">
      <button type="button" id="dl-btn" class="primary">モデルをダウンロード</button>
      <progress id="dl-progress" max="1" hidden></progress>
      <span id="dl-label"></span>
    </div>
    <div class="dl-note">
      Gemini Nano (数 GB) をこの端末に保存します。空きストレージ 22GB 以上・非従量制ネットワークを推奨。
      ダウンロード後の実行は完全にローカルで、質問文が外部に送信されることはありません。
      空き容量が 10GB を下回るとモデルは自動削除され、再ダウンロードが必要になります。
    </div>
  </div>
</div>

<div id="layout">
<button type="button" id="sidebar-backdrop" aria-label="サイドバーを閉じる" tabindex="-1"></button>
<aside id="sidebar">
  <button type="button" id="close-sidebar" aria-label="サイドバーを閉じる"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <button type="button" id="new-session">＋ 新規セッション</button>
  <div id="session-list"></div>
  <div class="sidebar-spacer"></div>
</aside>
<div id="main-col">

<div id="chat" style="flex: 1; overflow-y: auto; padding: 48px 32px; display: flex; flex-direction: column; gap: 24px; width: 100%; max-width: 840px; margin: 0 auto;"></div>

<div id="examples" style="padding: 0 32px; width: 100%; max-width: 840px; margin: 0 auto;"></div>

<div id="followups-container" style="padding: 0 32px; width: 100%; max-width: 840px; margin: 0 auto;"></div>

<div id="bottom">
  <form id="composer">
    <textarea id="input" placeholder="データについて質問してください" rows="1"></textarea>
    <button type="submit" id="send" class="primary" disabled>送信</button>
  </form>
</div>

</div><!-- /main-col -->
</div><!-- /layout -->


<script>
"use strict";

/* ================= 定数・状態 ================= */

var TOOL_TEMPLATES = {
  list_datasets: "list_datasets",
  inspect_dataset: "inspect_dataset",
  query_records: "query_records",
  summarize_records: "summarize_records",
};
var MAX_STEPS = 5;

/* arguments はキーと型を明示して constrained decoding の精度を上げる */
var ARGS_SCHEMA = {
  type: "object",
  properties: {
    dataset_id: { type: "string" },
    q: { type: "string" },
    search_fields: { type: "array", items: { type: "string" } },
    select: { type: "array", items: { type: "string" } },
    where: { type: "object" },
    order_by: { type: "string" },
    limit: { type: "integer" },
    cursor: { type: "string" },
    metrics: { type: "array", items: { type: "string" } },
    group_by: { type: "array", items: { type: "string" } },
    having: { type: "object" },
    explode: { type: "string" },
    publisher: { type: "string" },
  },
  /* 開いたままだとキー名の途中から不正トークンに脱線する
   * ("metricsстройки" 等が実測で発生) ため必ず閉じる */
  additionalProperties: false,
};

/* エージェントループ用の行動スキーマ。
 * 詳細な引数制約は二段階フローの引数生成側 (narrowedArgsSchema) が担うため、
 * ループの制約は軽量に保つ — 重い制約は実機で生成ストール (90s タイムアウト) を
 * 引き起こすことが実測されている。 */
var ACTION_SCHEMA_SIMPLE = {
  type: "object",
  properties: {
    action: { type: "string", enum: ["tool_call", "answer"] },
    tool: { type: "string", enum: Object.keys(TOOL_TEMPLATES) },
    arguments: { type: "object" },
    answer: { type: "string" },
  },
  required: ["action"],
};

/* SLM が生成した引数のサニタイズ:
 * - 呼び出すツールのパラメータに無いキーを除去 (/api/describe から導出。
 *   summarize に publisher が混入する等が実測で発生)
 * - スキーマ外キー (constrained decoding の脱線) と空値を除去。
 *   空値 ("", [], {}) はモデルが全キーを埋めようとした痕跡で、
 *   サーバーに渡すと未指定と意味が変わりうる (cursor:"" 等)。 */
var TOOL_PARAMS = {};  // tool name → { param name: true } (init で構築)

/* where 条件で有効な演算子 (これ以外のキーは計画テキスト等の混入とみなして除去) */
var WHERE_OPS = { "$gte": 1, "$lte": 1, "$ne": 1, "$eq": 1, "$not_contains": 1, "$not_empty": 1 };

/* 正規化名 (「の」・空白除去) → 正式フィールド名。
 * "オンライン化の実施時期" → "オンライン化実施時期" のような揺れを補正する。 */
function _fieldIndex() {
  var idx = {};
  catalogInfo.forEach(function(c) {
    (c.allFields || []).forEach(function(f) {
      idx[f.replace(/[の\s]/g, "")] = f;
    });
  });
  return idx;
}

function normalizeField(name, idx) {
  if (typeof name !== "string" || name === "") return null;
  var norm = name.replace(/[の\s]/g, "");
  if (idx[norm]) return idx[norm];
  /* 部分一致が一意ならその正式名に補正
   * ("本人確認手法" → "申請等における本人確認手法" が実測で発生)。
   * 複数候補に当たる場合は曖昧なので補正しない。 */
  var hits = [];
  Object.keys(idx).forEach(function(k) {
    if (k.indexOf(norm) >= 0 || norm.indexOf(k) >= 0) hits.push(idx[k]);
  });
  if (hits.length === 1) return hits[0];
  return name;  // 未知名はそのまま (サーバーのエラーで学ばせる)
}

function cleanArguments(tool, args) {
  var allowed = TOOL_PARAMS[tool] || ARGS_SCHEMA.properties;
  var idx = _fieldIndex();
  var out = {};
  Object.keys(args || {}).forEach(function(k) {
    if (!allowed[k] || !ARGS_SCHEMA.properties[k]) return;
    var v = args[k];
    if (v == null || v === "") return;
    if (Array.isArray(v) && v.length === 0) return;
    if (typeof v === "object" && !Array.isArray(v) && Object.keys(v).length === 0) return;
    out[k] = v;
  });

  /* フィールド名の揺れを正式名に正規化 */
  ["group_by", "select", "search_fields"].forEach(function(k) {
    if (Array.isArray(out[k])) {
      out[k] = out[k].map(function(f) { return normalizeField(f, idx); }).filter(Boolean);
      if (out[k].length === 0) delete out[k];
    }
  });
  /* group_by は groupable フィールドのみ (数値フィールドの混入が実測で発生) */
  var gset = {}, aset = {};
  catalogInfo.forEach(function(c) {
    (c.groupable || []).forEach(function(f) { gset[f] = 1; });
    (c.aggregatable || []).forEach(function(f) { aset[f] = 1; });
  });
  if (Array.isArray(out.group_by) && Object.keys(gset).length > 0) {
    out.group_by = out.group_by.filter(function(f) { return gset[f]; });
    if (out.group_by.length === 0) delete out.group_by;
  }
  if (typeof out.explode === "string") {
    var ex = normalizeField(out.explode, idx);
    /* explode はフィールド名のみ有効 ("true" 等の誤指定が実測で発生) */
    if (ex && idx[ex.replace(/[の\s]/g, "")]) out.explode = ex;
    else delete out.explode;
  }
  if (typeof out.order_by === "string") {
    var desc = out.order_by.charAt(0) === "-";
    var ob = normalizeField(desc ? out.order_by.slice(1) : out.order_by, idx);
    out.order_by = (desc ? "-" : "") + ob;
  }
  /* metrics は count / sum: / avg: / min: / max: のみ (フィールド名単体の混入が実測で発生) */
  if (Array.isArray(out.metrics)) {
    out.metrics = out.metrics.filter(function(m) {
      return typeof m === "string" && /^(count$|sum:|avg:|min:|max:)/.test(m);
    });
    if (out.metrics.length === 0) delete out.metrics;
  }
  /* where: キー正規化 + 演算子検証。$in は配列 (IN) に変換、未知キーは除去 */
  if (out.where && typeof out.where === "object" && !Array.isArray(out.where)) {
    var w = {};
    Object.keys(out.where).forEach(function(f) {
      var cond = out.where[f];
      var nf = normalizeField(f, idx);
      if (!nf) return;
      if (cond && typeof cond === "object" && !Array.isArray(cond)) {
        if (Array.isArray(cond.$in)) { w[nf] = cond.$in; return; }
        var ops = {};
        Object.keys(cond).forEach(function(op) {
          if (!WHERE_OPS[op]) return;
          /* 数値比較はaggregatable(数値)フィールドのみ有効。コード値フィールドへの
           * {"$lte": 2} のような比較 (実測で発生) は0件になるだけなので除去する */
          if ((op === "$gte" || op === "$lte") && typeof cond[op] === "number" &&
              Object.keys(aset).length > 0 && !aset[nf]) {
            return;
          }
          ops[op] = cond[op];
        });
        if (Object.keys(ops).length > 0) w[nf] = ops;
        return;
      }
      /* 空文字・空配列の条件は 0 件になるだけなので除去 (実測で発生) */
      if (cond === "" || cond == null ||
          (Array.isArray(cond) && cond.length === 0)) return;
      w[nf] = cond;
    });
    if (Object.keys(w).length > 0) out.where = w; else delete out.where;
  }
  /* dataset_id 必須のツールで欠落していたら補完する。多データセット時は
   * 質問との関連順 (catalogInfo[0]) を優先。
   * 「dataset_id が指定されていません」エラーが回答として露出した実測対策。 */
  if (allowed.dataset_id && !out.dataset_id && datasetIds.length > 0) {
    out.dataset_id = (catalogInfo[0] && catalogInfo[0].dataset_id) || datasetIds[0];
  }
  /* having は集計値 (count / sum:* 等) の絞り込み専用。キーは集計値のみ、
   * 値は演算子オブジェクトのみ許可 (">0" のような文字列は実測で発生 → 除去) */
  if (out.having && typeof out.having === "object") {
    var h = {};
    Object.keys(out.having).forEach(function(k) {
      if (!/^(count$|sum:|avg:|min:|max:)/.test(k)) return;
      var cond = out.having[k];
      if (cond && typeof cond === "object" && !Array.isArray(cond)) {
        var hops = {};
        Object.keys(cond).forEach(function(op) {
          if (WHERE_OPS[op]) hops[op] = cond[op];
        });
        if (Object.keys(hops).length > 0) h[k] = hops;
      }
    });
    if (Object.keys(h).length > 0) out.having = h; else delete out.having;
  }
  return out;
}

/* ハーネス側の品質注記: 使ったフィールドの記入率が低ければ回答末尾に必ず付ける。
 * SLM 任せにせず、カタログの品質情報から段取り側で保証する。 */
function appendQualityNotes(text, calls) {
  var notes = [];
  var seen = {};
  calls.forEach(function(c) {
    if (c.ok === false) return;  // 失敗した呼び出しのフィールドに注記は付けない
    var a = c.args || {};
    var fields = (a.group_by || []).slice();
    if (a.explode) fields.push(a.explode);
    if (a.where) fields = fields.concat(Object.keys(a.where));
    (a.metrics || []).forEach(function(m) {
      var p = String(m).split(":");
      if (p.length === 2) fields.push(p[1]);
    });
    fields.forEach(function(f) {
      if (seen[f]) return;
      catalogInfo.forEach(function(cat) {
        var fr = cat.fillRates && cat.fillRates[f];
        if (typeof fr === "number" && fr < 0.9 && !seen[f]) {
          seen[f] = true;
          notes.push("※ 「" + f + "」の記入率は " + Math.round(fr * 100) +
            "% です。未記入分は集計に含まれない点に注意してください。");
        }
      });
    });
  });
  if (notes.length === 0) return text;
  return text.replace(/\s*$/, "") + "\n" + notes.join("\n");
}

/* ================= Prompt API ラッパー: PreviewSession ================= */
/**
 * Prompt API native session をラップし、streaming + エラーハンドリングを統一
 */
function PreviewSession() {
  this.id = "session-" + Date.now();
  this.apiSession = null;  // LanguageModel.Session
  this.history = [];       // {role, content} の記録（表示用）
  this.abortController = null;
}

PreviewSession.prototype.init = function() {
  if (!LM || typeof LM.createSession !== "function") {
    // Prompt API 非対応環境：プレースホルダー session を作成
    this.apiSession = { placeholder: true };
    return Promise.resolve(this);
  }
  var self = this;
  return Promise.resolve(LM.createSession()).then(function(s) {
    self.apiSession = s;
    return self;
  }).catch(function(err) {
    // createSession 失敗時もプレースホルダーでフォールバック
    self.apiSession = { placeholder: true };
    return self;
  });
};

/**
 * LLM にプロンプトを送信、結果を受け取り
 * Prompt API 非対応環境では、既存の session.prompt() を使用
 * callback: {onChunk, onError, onEnd}
 */
PreviewSession.prototype.prompt = function(text, callback) {
  callback = callback || {};
  if (!this.apiSession) {
    callback.onError && callback.onError(new Error("Session not initialized"));
    return Promise.reject(new Error("Session not initialized"));
  }

  var self = this;
  this.history.push({ role: "user", content: text });

  // プレースホルダー session（Prompt API 非対応）の場合、グローバル session を使用
  if (this.apiSession.placeholder && typeof window.session !== "undefined" && window.session && window.session.prompt) {
    console.log("Using fallback session (Prompt API not available)");
    return window.session.prompt(text, callback).then(function(result) {
      self.history.push({ role: "assistant", content: result });
      callback.onEnd && callback.onEnd(result);
      return result;
    }).catch(function(err) {
      console.error("Fallback session error:", err);
      callback.onError && callback.onError(err);
      throw err;
    });
  }

  // Prompt API 対応環境
  this.abortController = new AbortController();
  var fullText = "";

  return Promise.resolve(this.apiSession.prompt(text, {
    signal: this.abortController.signal,
  })).then(function(stream) {
    if (!stream[Symbol.asyncIterator]) {
      return Promise.resolve(stream).then(function(result) {
        fullText = (typeof result === "string") ? result : String(result);
        return fullText;
      });
    }
    return (async function() {
      for await (var chunk of stream) {
        if (typeof chunk === "string") {
          fullText += chunk;
          callback.onChunk && callback.onChunk(chunk);
        }
      }
      return fullText;
    })();
  }).then(function(result) {
    self.history.push({ role: "assistant", content: fullText || result });
    callback.onEnd && callback.onEnd(fullText || result);
    return fullText || result;
  }).catch(function(err) {
    if (err.name === "AbortError") {
      callback.onError && callback.onError(new Error("Prompt cancelled"));
    } else {
      callback.onError && callback.onError(err);
    }
    throw err;
  });
};

PreviewSession.prototype.abort = function() {
  if (this.abortController) {
    this.abortController.abort();
  }
};

PreviewSession.prototype.clone = function() {
  var cloned = new PreviewSession();
  cloned.history = this.history.slice();  // 浅いコピー
  if (this.apiSession && typeof this.apiSession.clone === "function") {
    cloned.apiSession = this.apiSession.clone();
  }
  return cloned;
};

PreviewSession.prototype.destroy = function() {
  if (this.apiSession && typeof this.apiSession.destroy === "function") {
    this.apiSession.destroy();
  }
  this.apiSession = null;
  this.history = [];
};

function apiCall(name, args) {
  return fetch("/api/call", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name: name, arguments: args || {} }),
  }).then(function(res) {
    return res.json().then(function(data) {
      if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
      return data;
    });
  }).catch(function(err) {
    /* fetch エラー or JSON parse 失敗をより詳細に報告する */
    var msg = err && err.message ? err.message : String(err);
    if (msg === "Failed to fetch") {
      throw new Error("サーバーに接続できません。ホストが起動しているか確認してください。");
    }
    throw err;
  });
}

/* ================= セッション管理 (Claude/ChatGPT ライク) ================= */
/* セッション = 会話の単位。localStorage に一覧とトランスクリプトを保存する。
 * 新規セッション作成時は MCP 推奨フロー (list → inspect) を再実行する (再取得原則)。
 * トランスクリプトはテキストとツール結果の最大 1KB の要約のみ保存する。 */
var LS_SESSIONS = "apcli-preview:sessions";
var LS_SESSION_PREFIX = "apcli-preview:session:";
var currentSessionId = null;
var currentTranscript = [];
var _restoring = false;
var _sessionListed = false;  // 最初のユーザー発話があったら一覧に載せる

function sessionIndex() { return lsGet(LS_SESSIONS) || []; }
function saveSessionIndex(list) {
  var kept = list.slice(0, 30);
  if (!lsSet(LS_SESSIONS, kept)) return;

  /* 30 件の一覧から外れたセッションの本体を削除する。
   * 先にキーを収集し、localStorage を列挙中に変更しない。 */
  var keptKeys = new Set(kept.map(function(s) { return LS_SESSION_PREFIX + s.id; }));
  var staleKeys = [];
  try {
    for (var i = 0; i < localStorage.length; i++) {
      var key = localStorage.key(i);
      if (key && key.indexOf(LS_SESSION_PREFIX) === 0 && !keptKeys.has(key)) {
        staleKeys.push(key);
      }
    }
    staleKeys.forEach(function(key) { localStorage.removeItem(key); });
  } catch (e) { /* localStorage 無効環境では一覧保存のみ */ }
}

function persistTranscript() {
  if (!_sessionListed || !currentSessionId) return;
  lsSet(LS_SESSION_PREFIX + currentSessionId, currentTranscript.slice(-300));
}

function recordEntry(entry) {
  if (_restoring) return entry;
  currentTranscript.push(entry);
  if (!_sessionListed && entry.kind === "user") {
    _sessionListed = true;
    var list = sessionIndex().filter(function(s) { return s.id !== currentSessionId; });
    list.unshift({ id: currentSessionId,
                   title: String(entry.text || "").slice(0, 40) || "(無題)",
                   at: Date.now() });
    saveSessionIndex(list);
    renderSessionList();
  }
  persistTranscript();
  return entry;
}

function renderSessionList() {
  var el = document.getElementById("session-list");
  if (!el) return;
  el.innerHTML = "";
  sessionIndex().forEach(function(s) {
    var row = document.createElement("div");
    row.className = "session-item" + (s.id === currentSessionId ? " active" : "");
    var btn = document.createElement("button");
    btn.className = "session-open";
    btn.textContent = s.title || "(無題)";
    btn.title = new Date(s.at).toLocaleString();
    btn.addEventListener("click", function() {
      if (!busy && s.id !== currentSessionId) openSession(s.id);
    });
    var del = document.createElement("button");
    del.className = "session-del";
    del.innerHTML = ICONS.close;
    del.setAttribute("aria-label", "セッション「" + (s.title || "無題") + "」を削除");
    del.addEventListener("click", function(ev) {
      ev.stopPropagation();
      if (!busy) deleteSession(s.id);
    });
    row.appendChild(btn);
    row.appendChild(del);
    el.appendChild(row);
  });
}

function startNewSession(withDiscovery) {
  currentSessionId = "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  currentTranscript = [];
  lastTurnCall = null;  // 文脈参照は前セッションへ持ち越さない
  _sessionListed = false;
  chatEl.innerHTML = "";
  clearFollowups();  // 「次の一手」は前セッションの文脈なので消す
  renderSessionList();
  if (withDiscovery) return runDiscovery();
  return Promise.resolve();
}

function openSession(id) {
  var t = lsGet(LS_SESSION_PREFIX + id) || [];
  currentSessionId = id;
  currentTranscript = t.slice();
  lastTurnCall = null;  // 復元セッションの文脈は復元後の会話で作り直す
  _sessionListed = true;
  _restoring = true;
  chatEl.innerHTML = "";
  clearFollowups();  // 「次の一手」は元セッションの文脈なので消す
  t.forEach(function(e) {
    if (e.kind === "tool") {
      var card = document.createElement("div");
      card.className = "tool-card";
      card.innerHTML = '<div class="tc-head"><span class="tc-name"></span>' +
        '<span class="tc-query"></span><span class="tc-state"></span></div>';
      card.querySelector(".tc-name").textContent = e.tool || "";
      card.querySelector(".tc-state").textContent =
        (e.ok === false ? "エラー・" : "") + "履歴";
      card.querySelector(".tc-query").textContent = e.query || "";
      chatEl.appendChild(card);

      /* 容量制限で結果を省略した場合は、空の結果 UI を表示しない。 */
      if (e.summary && e.summary._truncated && e.ok !== false) {
        var omitted = document.createElement("div");
        omitted.className = "msg note";
        var countLabel = e.summary.total_group_count != null ? "グループ数" : "件数";
        var count = e.summary.total != null ? e.summary.total
          : e.summary.total_group_count != null ? e.summary.total_group_count
          : e.summary.record_count;
        omitted.textContent = "結果の詳細は履歴容量を抑えるため省略しました" +
          (count != null ? "（" + countLabel + ": " + String(count) + "）" : "") + "。";
        card.appendChild(omitted);
      } else if (e.summary && e.ok !== false && TOOL_TEMPLATES[e.tool]) {
        var iframe = document.createElement("iframe");
        iframe.setAttribute("sandbox", "allow-scripts");
        iframe.style.display = "block";
        iframe.style.width = "100%";
        iframe.style.height = "340px";
        iframe.style.background = "var(--bg)";
        iframe.style.border = "1px solid var(--border)";
        iframe.style.borderRadius = "8px";
        iframe.style.marginTop = "6px";
        card.appendChild(iframe);
        var st = { iframe: iframe, result: { structuredContent: e.summary }, ready: false };
        frames.set(iframe.contentWindow, st);
        iframe.src = "/ui/" + TOOL_TEMPLATES[e.tool] + "?theme=light";
      }
    } else {
      addMsg(e.kind || "note", e.text || "");
    }
  });
  _restoring = false;

  // 履歴から dataset_id を抽出してカタログ情報を復元
  var usedDatasets = [];
  t.forEach(function(e) {
    if (e.tool === "summarize_records" || e.tool === "query_records") {
      var datasetId = e.args && e.args.dataset_id;
      if (datasetId && usedDatasets.indexOf(datasetId) < 0) {
        usedDatasets.push(datasetId);
      }
    }
  });
  if (usedDatasets.length > 0) {
    // 使用されたデータセット情報を復元（inspect 済みのデータセットから）
    var datasets = datasetList.filter(function(d) {
      return usedDatasets.indexOf(d.dataset_id) >= 0;
    });
    if (datasets.length > 0) {
      // 初期化時に prefetch したカタログから対応するデータセットを取得
      var entries = datasets.map(function(d) {
        var key = "apcli-preview:catalog4:" + d.dataset_id;
        var cached = lsGet(key);
        return cached && cached.entry;
      }).filter(Boolean);
      if (entries.length > 0) {
        finishDiscovery(entries, datasets);
      }
    }
  }

  renderSessionList();
  chatEl.scrollTop = chatEl.scrollHeight;
}

function deleteSession(id) {
  saveSessionIndex(sessionIndex().filter(function(s) { return s.id !== id; }));
  try { localStorage.removeItem(LS_SESSION_PREFIX + id); } catch (e) { /* noop */ }
  if (id === currentSessionId) {
    startNewSession(true);
  } else {
    renderSessionList();
  }
}

/* ブラウザ側エラーの転送: 開発側の環境で再現しない不具合を
 * turn-log 経由で追跡できるようにする。
 * 無害な定型警告は除外し、1 ページにつき最大 5 件までに制限する
 * (ResizeObserver 警告の無限転送でログが洪水になった実測対策)。 */
var _errForwarded = 0;
var _BENIGN_ERRORS = /ResizeObserver loop|Script error\.$/;
["error", "unhandledrejection"].forEach(function(evType) {
  window.addEventListener(evType, function(e) {
    if (_errForwarded >= 5) return;
    var msg = evType === "error"
      ? String(e.message || "") + " @" + String(e.filename || "").split("/").pop() + ":" + (e.lineno || 0)
      : "unhandledrejection: " + String((e.reason && e.reason.message) || e.reason || "");
    if (_BENIGN_ERRORS.test(msg)) return;
    _errForwarded++;
    try {
      fetch("/api/turn-log", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ q: "(browser error)", calls: [],
                               answer: msg.slice(0, 300) }),
      }).catch(function() { /* noop */ });
    } catch (err) { /* noop */ }
  });
});

function addMsg(cls, text) {
  if (cls === "user") {
    // 新しいターンの開始 — 区切り線で 1 件 1 件の境界を明示する (eval 中のみ表示)
    var sep = document.createElement("div");
    sep.className = "turn-sep";
    chatEl.appendChild(sep);
  }
  var el = document.createElement("div");
  el.className = "msg " + cls;
  el.textContent = text;
  chatEl.appendChild(el);
  chatEl.scrollTop = chatEl.scrollHeight;
  if (cls.indexOf("thinking") < 0) {
    recordEntry({ kind: cls.split(" ")[0], text: String(text).slice(0, 500) });

  return el;
}

/* ── ターン内の進行ステップ表示 ──
 * 「考えています…」の代わりに、何をしているか (選択/引数生成/実行/返送/回答) を
 * 行で流す。各行はクリックで詳細 (モデル生出力・引数・抜粋) を展開できる。 */
var _stepsHost = null;  // { line, detailPre, activeSeg }

function beginTurnSteps() {
  var wrap = document.createElement("div");
  wrap.className = "turn-steps";
  var line = document.createElement("div");
  line.className = "steps-line";
  wrap.appendChild(line);
  var detailPre = document.createElement("pre");
  detailPre.className = "step-detail";
  detailPre.hidden = true;
  wrap.appendChild(detailPre);
  chatEl.appendChild(wrap);
  _stepsHost = { line: line, detailPre: detailPre, activeSeg: null };
}

/* パンくず 1 行 (a › b › c) にステップを追加する。
 * done(label, detail) で確定し、detail 付きセグメントはクリックで下に展開 */
function stepStart(label) {
  if (!_stepsHost) return { done: function() {} };
  var host = _stepsHost;
  if (host.line.childElementCount > 0) {
    var sep = document.createElement("span");
    sep.className = "sep";
    sep.textContent = "›";
    host.line.appendChild(sep);
  }
  var seg = document.createElement("span");
  seg.className = "seg running";
  seg.textContent = label;
  host.line.appendChild(seg);
  chatEl.scrollTop = chatEl.scrollHeight;
  var finished = false;
  return {
    done: function(finalLabel, detailText) {
      if (finished) return;
      finished = true;
      seg.classList.remove("running");
      seg.textContent = finalLabel || label;
      if (!detailText) return;
      seg.classList.add("has-detail");
      seg.setAttribute("role", "button");
      seg.tabIndex = 0;
      var toggle = function() {
        if (host.activeSeg === seg) {
          host.detailPre.hidden = true;
          seg.classList.remove("active");
          host.activeSeg = null;
        } else {
          if (host.activeSeg) host.activeSeg.classList.remove("active");
          host.detailPre.textContent = detailText;
          host.detailPre.hidden = false;
          seg.classList.add("active");
          host.activeSeg = seg;
        }
      };
      seg.addEventListener("click", toggle);
      seg.addEventListener("keydown", function(e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
      });
    },
  };
}

function setStatus(text, cls) {
  statusEl.className = cls || "";
  statusEl.setAttribute("aria-label", text);
  statusEl.setAttribute("data-tip", text);
  statusEl.innerHTML =
    '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">' +
    '<circle cx="6" cy="6" r="5" fill="currentColor"/></svg>';
}

/* ================= MCP Apps ホストブリッジ ================= */
/* iframe (base.js の軽量クライアント) と JSON-RPC over postMessage で会話する。
 * ui/initialize に応答 → initialized 受信後に tool-result 通知を送る。
 * iframe からの tools/call は /api/call に中継する (summarize のドリルダウン等)。 */

var frames = new Map(); // contentWindow → { iframe, result, ready }

window.addEventListener("message", function(event) {
  var msg = event.data;

  /* list_datasets UI でデータセットが選択された */
  if (msg && msg.type === "dataset-selected" && msg.dataset_id) {
    var dataset_entry = datasetList.find(function(d) { return d.dataset_id === msg.dataset_id; });
    if (dataset_entry) {
      addMsg("note", "データセット「" + msg.dataset_id + "」を選択しました。情報を取得中…");
      inputEl.disabled = true;
      sendBtn.disabled = true;
      inspectAndStartSession(dataset_entry).then(function() {
        inputEl.disabled = false;
        sendBtn.disabled = false;
        addMsg("note", "✓ 準備完了。質問をどうぞ");
      }).catch(function() {
        inputEl.disabled = false;
        sendBtn.disabled = false;
      });
    }
    return;
  }

  var st = frames.get(event.source);
  if (!st) return;
  if (!msg || msg.jsonrpc !== "2.0") return;

  if (msg.method === "ui/initialize" && msg.id != null) {
    event.source.postMessage({
      jsonrpc: "2.0", id: msg.id,
      result: {
        protocolVersion: "2026-01-26",
        hostInfo: { name: "apcli-preview", version: "1.0.0" },
        hostCapabilities: { serverTools: {} },
      },
    }, "*");
  } else if (msg.method === "ui/notifications/initialized") {
    st.ready = true;
    if (st.result) {
      event.source.postMessage({
        jsonrpc: "2.0",
        method: "ui/notifications/tool-result",
        params: st.result,
      }, "*");
    }
  } else if (msg.method === "ui/notifications/size-changed") {
    var h = msg.params && msg.params.height;
    if (h) st.iframe.style.height = Math.max(160, Math.min(h + 8, 2000)) + "px";
  } else if (msg.method === "tools/call" && msg.id != null) {
    var p = msg.params || {};
    apiCall(p.name, p.arguments).then(function(result) {
      event.source.postMessage({ jsonrpc: "2.0", id: msg.id, result: result }, "*");
    }).catch(function(err) {
      event.source.postMessage({
        jsonrpc: "2.0", id: msg.id,
        error: { code: -32000, message: String(err && err.message || err) },
      }, "*");
    });
  }
});

/* ── ローカル知識キャッシュ (localStorage) ── */

function lsGet(key) {
  try { var s = localStorage.getItem(key); return s ? JSON.parse(s) : null; }
  catch (e) { return null; }
}
function lsSet(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
    return true;
  } catch (e) {
    return false;  // quota 超過・localStorage 無効環境
  }
}

/* 教訓メモリ: 失敗した呼び出し (0件/エラー) と、その後成功した呼び出しを
 * ローカルに記録し、後のセッションのシステムプロンプトに注入する。
 * eval では run 間の比較可能性を守るため既定オフ (?lessons=1 で有効化)。 */
var LS_LESSONS = "apcli-preview:lessons";

function lessonsEnabled() {
  var v = new URLSearchParams(location.search).get("lessons");
  if (v === "1") return true;
  if (v === "0") return false;
  return !isEvalMode();
}

function recordLesson(lesson) {
  var all = lsGet(LS_LESSONS) || [];
  var key = lesson.tool + JSON.stringify(lesson.args) + lesson.outcome;
  all = all.filter(function(l) {
    return (l.tool + JSON.stringify(l.args) + l.outcome) !== key;
  });
  all.push(lesson);
  if (all.length > 20) all = all.slice(all.length - 20);
  lsSet(LS_LESSONS, all);
}

function lessonLines(limit) {
  var all = lsGet(LS_LESSONS) || [];
  return all.slice(-limit).map(function(l) {
    var s = l.tool + " " + JSON.stringify(l.args) + " → " + l.outcome;
    if (l.followup) {
      s += " / その後 " + l.followup.tool + " " + JSON.stringify(l.followup.args) + " で成功";
    }
    return s.length > 160 ? s.slice(0, 160) + "…" : s;
  });
}

/* 観測ストア: 実際のツール結果から得た品質観測をローカルに蓄積し、
 * 質問に関連するものだけを毎ターン取り出してプロンプトに添える (逐次参照)。
 * 内容はすべて実行結果由来 (フィールドの群数・上位値・キーワードの該当件数) で、
 * データセット固有の文言は持たない。教訓メモリと同じスイッチで制御する。 */
var LS_OBSERVED = "apcli-preview:observed";
var OBSERVED_CAP = 40;

function recordObservation(tool, args, data) {
  if (!lessonsEnabled()) return;
  var store = lsGet(LS_OBSERVED) || { fields: {}, keywords: {} };
  if (tool === "summarize_records" && Array.isArray(args.group_by) &&
      args.group_by.length === 1 && Array.isArray(data.rows) && data.rows.length > 0) {
    store.fields[args.group_by[0]] = {
      groups: data.total_groups != null ? data.total_groups : data.rows.length,
      top: data.rows.slice(0, 3).map(function(r) { return String((r || [])[0]); }),
      at: Date.now(),
    };
  }
  if (tool === "query_records" && typeof args.q === "string" && args.q &&
      data.total != null) {
    store.keywords[args.q] = { total: data.total, at: Date.now() };
  }
  ["fields", "keywords"].forEach(function(kind) {
    var keys = Object.keys(store[kind]);
    if (keys.length > OBSERVED_CAP) {
      keys.sort(function(a, b) { return (store[kind][a].at || 0) - (store[kind][b].at || 0); });
      keys.slice(0, keys.length - OBSERVED_CAP).forEach(function(k) { delete store[kind][k]; });
    }
  });
  lsSet(LS_OBSERVED, store);
}

/* 質問文に関連する観測を最大2件取り出す (小さなローカル RAG) */
function observationHints(question) {
  if (!lessonsEnabled()) return [];
  var store = lsGet(LS_OBSERVED) || { fields: {}, keywords: {} };
  var qNorm = question.replace(/[の\s]/g, "");
  var hints = [];
  Object.keys(store.fields).forEach(function(f) {
    if (hints.length >= 2) return;
    if (qNorm.indexOf(f.replace(/[の\s]/g, "")) >= 0) {
      var o = store.fields[f];
      hints.push("「" + f + "」の集計は約" + o.groups + "群、上位: " + o.top.join("、"));
    }
  });
  Object.keys(store.keywords).forEach(function(k) {
    if (hints.length >= 2) return;
    if (question.indexOf(k) >= 0) {
      hints.push("キーワード「" + k + "」の検索該当は約" + store.keywords[k].total + "件");
    }
  });
  return hints;
}

/* ── フィールド候補の検索 (ハーネス側の決定的マッチング) ──
 * 大型 LLM が文脈内で暗黙にやる「ユーザー語彙 → 項目名」の対応付けを、
 * カタログとの文字バイグラム類似 + codelist 値の一致で決定的に肩代わりする。
 * カタログのみから導出され毎回同じ結果になるため eval でも常時有効。 */

function _bigrams(s) {
  var set = {};
  var t = String(s).replace(/[\sのがをにはでと、。?？!！]/g, "");
  for (var i = 0; i < t.length - 1; i++) set[t.slice(i, i + 2)] = 1;
  return set;
}

function _dice(a, b) {
  var ka = Object.keys(a), kb = Object.keys(b);
  if (ka.length === 0 || kb.length === 0) return 0;
  var shared = 0;
  ka.forEach(function(k) { if (b[k]) shared++; });
  return 2 * shared / (ka.length + kb.length);
}

/* 最長共通部分列の長さ (部分語マッチ: 「府省庁ごと」→「所管府省庁」) */
function _lcsLen(a, b) {
  var m = a.length, n = b.length;
  var prev = new Array(n + 1).fill(0);
  var best = 0;
  for (var i = 1; i <= m; i++) {
    var cur = [0];
    for (var j = 1; j <= n; j++) {
      cur[j] = a[i - 1] === b[j - 1] ? prev[j - 1] + 1 : 0;
      if (cur[j] > best) best = cur[j];
    }
    prev = cur;
  }
  return best;
}

/* 日本語の数量表現を数値へ ("10万" → 100000, "2億" → 200000000) */
function _parseJpNumber(s) {
  var m = String(s).replace(/,/g, "").match(/^(\d+(?:\.\d+)?)(万|億)?$/);
  if (!m) return null;
  var v = parseFloat(m[1]);
  if (m[2] === "万") v *= 1e4;
  if (m[2] === "億") v *= 1e8;
  return v;
}

/* s が t の部分列 (順序を保って含まれる) か */
function _isSubsequence(s, t) {
  var i = 0;
  for (var j = 0; j < t.length && i < s.length; j++) {
    if (t[j] === s[i]) i++;
  }
  return i === s.length;
}

/* 略称→正式値の解決: 「国交省」→「国土交通省」のような日本語略称は
 * 「先頭・末尾の文字が一致する部分列」になる一般則を使い、
 * codelist と観測ストアの実測値に対して照合する (汎用・データセット非依存)。 */
function _abbrevValueHit(question) {
  if (question.length > 120) return null;
  var candidates = [];
  catalogInfo.forEach(function(c) {
    Object.keys(c.codelists || {}).forEach(function(f) {
      (c.codelists[f] || []).forEach(function(v) { candidates.push({ f: f, v: v }); });
    });
  });
  if (lessonsEnabled()) {
    var store = lsGet(LS_OBSERVED) || {};
    Object.keys(store.fields || {}).forEach(function(f) {
      ((store.fields[f] || {}).top || []).forEach(function(v) {
        candidates.push({ f: f, v: v });
      });
    });
  }
  for (var ci = 0; ci < candidates.length; ci++) {
    var label = String(candidates[ci].v).replace(/^[\d\-]+\s*/, "");
    if (label.length < 4 || question.indexOf(label) >= 0) continue;
    for (var len = 3; len <= 5; len++) {
      for (var s = 0; s + len <= question.length; s++) {
        var sub = question.slice(s, s + len);
        if (sub !== label &&
            sub.charAt(0) === label.charAt(0) &&
            sub.charAt(len - 1) === label.charAt(label.length - 1) &&
            _isSubsequence(sub, label)) {
          return { f: candidates[ci].f, v: candidates[ci].v };
        }
      }
    }
  }
  return null;
}

/* desc 照合の内容語トークン: 漢字2文字の窓 + カタカナ語 (3文字以上) */
function _contentTokens(qn) {
  var toks = {};
  for (var i = 0; i + 2 <= qn.length; i++) {
    var t = qn.slice(i, i + 2);
    if (/^[一-鿿]{2}$/.test(t)) toks[t] = true;
  }
  (qn.match(/[ァ-ヶー]{3,}/g) || []).forEach(function(t) { toks[t] = true; });
  return Object.keys(toks);
}

/* desc 照合 (PoC)。?desch=0 で無効化して A/B 測定できる */
function descHintsEnabled() {
  return cfgParam("desch") !== "0";
}

function fieldHints(question) {
  var qn = question.replace(/[\sのがをにはでと、。?？!！]/g, "");
  var qb = _bigrams(question);
  var crossIntent = /クロス|掛け合わせ/.test(question);
  var scored = [];
  var valueHit = null;
  catalogInfo.forEach(function(c) {
    (c.allFields || []).forEach(function(f) {
      var fn = f.replace(/[\sの]/g, "");
      var score;
      if (question.indexOf(f) >= 0) {
        score = 1;
      } else {
        var lcs = _lcsLen(qn, fn);
        score = Math.max(
          _dice(qb, _bigrams(f)),
          /* 3文字以上の連続一致は floor 0.4 (「懸念点」等の短い部分語を拾う) */
          lcs >= 3 ? Math.max(0.4, lcs / fn.length) : 0);
      }
      if (score >= 0.25) {
        scored.push({
          f: f, fn: fn, score: score,
          groupable: c.groupable.indexOf(f) >= 0,
          aggregatable: c.aggregatable.indexOf(f) >= 0,
        });
      }
    });
    Object.keys(c.codelists || {}).forEach(function(f) {
      (c.codelists[f] || []).forEach(function(v) {
        var label = String(v).replace(/^[\d\-]+\s*/, "");  // "3 縦覧等" → "縦覧等"
        /* 最長ラベルの一致を採用する。先勝ちだと「申請等」(1 申請等) が
         * 「申請等に基づく処分通知等」(2-1) を部分文字列として吸ってしまう */
        if (label.length >= 2 && question.indexOf(label) >= 0 &&
            (!valueHit || label.length > (valueHit._labelLen || 0))) {
          valueHit = { f: f, v: v, _labelLen: label.length };
        }
      });
    });
  });
  /* desc 照合: フィールド名で拾えない言い回し (「根拠となる法律」→ 法令名 等) を
   * dataset.yaml の説明文と突合して拾う。desc は信頼境界の外 (第三者が書ける
   * 自由記述) のため、本文はプロンプトに一切出さず照合の語彙としてだけ使う。
   * スコアは 0.35 固定で名前一致 (完全 1.0 / 部分 0.4+) より常に下に置き、
   * 名前で拾えた候補を押し退けないようにする */
  if (descHintsEnabled()) {
    /* 集計の定型語 (「◯◯ごとの件数」等) は内容語ではないので突合しない。
     * measure 系フィールドの desc (「…の件数」) への誤ヒット対策 */
    var qtoks = _contentTokens(qn).filter(function(t) {
      return !/^(件数|合計|平均|総数|総計|内訳|一覧|分布|割合|構成|上位|順位)$/.test(t);
    });
    var descTokenHits = {};  // tok → { field: catalog } (一般語の棄却用)
    catalogInfo.forEach(function(c) {
      Object.keys(c.descs || {}).forEach(function(f) {
        var d = c.descs[f];
        qtoks.forEach(function(tok) {
          if (d.indexOf(tok) >= 0) {
            if (!descTokenHits[tok]) descTokenHits[tok] = {};
            descTokenHits[tok][f] = c;
          }
        });
      });
    });
    var descPushed = {};
    Object.keys(descTokenHits).forEach(function(tok) {
      var fs = Object.keys(descTokenHits[tok]);
      if (fs.length > 3) return;  // 多くの desc に現れる一般語 (「手続」等) は棄却
      fs.forEach(function(f) {
        if (descPushed[f]) return;
        descPushed[f] = true;
        if (scored.some(function(x) { return x.f === f; })) return;  // 名前一致を優先
        var c = descTokenHits[tok][f];
        scored.push({
          f: f, fn: f.replace(/[\sの]/g, ""), score: 0.35, desc_hit: true,
          groupable: c.groupable.indexOf(f) >= 0,
          aggregatable: c.aggregatable.indexOf(f) >= 0,
        });
      });
    });
  }
  /* 同点は長い (=より特定的な) 名前を優先。
   * 「非オンライン手続件数」が部分文字列の「オンライン手続件数」に吸われる事故対策 */
  /* 候補ゼロのときは 2 文字の漢字内容語 (「士業」等) をフィールド名の
   * 部分一致で拾う。多数のフィールドに当たる一般語 (「手続」等) は除外 */
  if (scored.length === 0) {
    /* トークンごとに判定する: 「士業」(1 フィールド一致) は採用し、
     * 「手続」(多数一致の一般語) はそのトークンだけ棄却する */
    var tokenHits = {};  // tok → { field: catalog }
    for (var qi = 0; qi + 2 <= qn.length; qi++) {
      var tok = qn.slice(qi, qi + 2);
      if (!/^[一-鿿]{2}$/.test(tok)) continue;
      catalogInfo.forEach(function(c) {
        (c.allFields || []).forEach(function(f) {
          if (f.indexOf(tok) >= 0) {
            if (!tokenHits[tok]) tokenHits[tok] = {};
            tokenHits[tok][f] = c;
          }
        });
      });
    }
    var pushed = {};
    Object.keys(tokenHits).forEach(function(tok) {
      var fs = Object.keys(tokenHits[tok]);
      if (fs.length > 2) return;  // 一般語は棄却
      fs.forEach(function(f) {
        if (pushed[f]) return;
        pushed[f] = true;
        var c = tokenHits[tok][f];
        scored.push({
          f: f, fn: f.replace(/[\sの]/g, ""), score: 0.35,
          groupable: c.groupable.indexOf(f) >= 0,
          aggregatable: c.aggregatable.indexOf(f) >= 0,
        });
      });
    });
  }
  /* codelist 値の完全一致が無ければ略称照合 (国交省 → 国土交通省 等) を試す */
  if (!valueHit) valueHit = _abbrevValueHit(question);
  /* 「フィールドが「値”」の引用形式は where 指定として解釈する。
   * codelist が無いフィールド (所管府省庁等) のドリルダウンもこれで通る。
   * 明示的な引用は codelist 照合より確実なので、既存の valueHit を上書きする */
  var qv = question.match(/([^\s「」、。]+?)が「([^」]+)」/);
  if (qv) {
    var qvf = normalizeField(qv[1], _fieldIndex());
    if (qvf) {
      var qvv = qv[2];
      /* 引用値が codelist のコード値またはラベルと完全一致するならコード値に
       * 解決する (「申請等」→ "1 申請等")。部分一致 where が「申請等に基づく…」
       * まで巻き込むのを防ぐ。一致しない引用値はそのまま使う */
      catalogInfo.forEach(function(c) {
        ((c.codelists || {})[qvf] || []).forEach(function(v) {
          var vs = String(v);
          if (vs === qv[2] || vs.replace(/^[\d\-]+\s*/, "") === qv[2]) qvv = vs;
        });
      });
      valueHit = { f: qvf, v: qvv };
    }
  }
  scored.sort(function(a, b) { return b.score - a.score || b.f.length - a.f.length; });
  /* 同義候補の重複排除: 名前の共通部分列が長い候補 (所管府省庁/実施府省庁 等) は
   * 上位のみ残す。ただしクロス集計の意図がある場合は 2 軸目を殺さないよう保持
   * (「提出方法と電子署名」は共通接頭辞「添付書類等」を持つが別フィールド)。 */
  var top = [];
  scored.forEach(function(x) {
    if (top.length >= 3) return;
    var dup = !crossIntent && top.some(function(t) { return _lcsLen(t.fn, x.fn) >= 3; });
    if (!dup) top.push(x);
  });

  var hints = [];
  if (top.length > 0) {
    hints.push("関連フィールド候補: " +
      top.slice(0, 2).map(function(x) { return x.f; }).join("、"));
  }

  /* 質問の意図語 + 候補フィールドから「呼び出し候補」を1個の完結した形で提案する。
   * 断片 (group_by 候補 / metrics 候補) を別々に出すと片方だけ採用される
   * 事故が実測で発生したため、tool + args をまとめて示す。 */
  /* desc 由来の候補は、名前一致の groupable 候補が無いときだけ軸に使う。
   * 名前一致に対する2軸目として勝手に加えると、desc 照合の有無で提案が
   * 変わってしまう (クロス意図が明示された場合は両方使う) */
  var gTop = top.filter(function(x) { return x.groupable && x.score >= 0.35; });
  var gName = gTop.filter(function(x) { return !x.desc_hit; });
  var groupable = (gName.length > 0 && !crossIntent ? gName : gTop)
    .map(function(x) { return x.f; });
  var descOnlyAxes = gName.length === 0;
  var aggs = top.filter(function(x) { return x.aggregatable; }).map(function(x) { return x.f; });

  var aggIntent = /ごと|毎|別|内訳|分布|割合|構成|クロス|集計|分け/.test(question);
  var sumIntent = /合計|総計|総和/.test(question);
  var avgIntent = /平均/.test(question);
  var orderIntent = /多い順|少ない順|順に|トップ|ランキング|上位/.test(question);
  var listIntent = /見せて|一覧|検索|探して|表示|リスト/.test(question);
  /* 「最も◯◯が多いXはどこ?」型 = 集計してランキング */
  var rankIntent = /一番|最も|多い|少ない/.test(question) && /どこ|どれ|どの|何/.test(question);
  /* 話題語の抽出: 「◯◯に関する手続」「◯◯の手続」→ キーワード検索の提案材料 */
  var topic = null;
  var tm = question.match(/「?([^「」\s、。]{2,12})」?(?:に関する|に関して|について|関係の|の手続)/);
  if (tm) topic = tm[1].replace(/の$/, "");

  /* 数値しきい値: 「10万件を超える」→ {"$gte": 100000} */
  var thWhere = null;
  var thMatch = question.replace(/,/g, "").match(
    /(\d+(?:\.\d+)?(?:万|億)?)\s*(?:件|円|人|回)?\s*(を?超え|以上|より多い|以下|未満|より少ない)/);
  if (thMatch && aggs.length > 0) {
    var n = _parseJpNumber(thMatch[1]);
    if (n != null) {
      thWhere = {};
      thWhere[aggs[0]] = /以下|未満|より少ない/.test(thMatch[2]) ? { "$lte": n } : { "$gte": n };
    }
  }

  var sug = null;
  if (orderIntent && listIntent && aggs.length > 0) {
    sug = { tool: "query_records", args: { order_by: "-" + aggs[0], limit: 20 } };
  } else if (thWhere && !aggIntent) {
    sug = { tool: "query_records", args: { where: thWhere, limit: 20 } };
  } else if (aggIntent || sumIntent || avgIntent || rankIntent ||
             (valueHit && !listIntent)) {
    var args = {};
    if (groupable.length > 0 && /ごと|毎|別|内訳|分布|割合|構成|クロス|分け/.test(question)) {
      /* desc 由来の候補しか無いときは確度が低いので、クロス意図が無ければ1軸に絞る */
      args.group_by = groupable.slice(
        0, crossIntent || (groupable.length >= 2 && !descOnlyAxes) ? 2 : 1);
    }
    if (!args.group_by && rankIntent && groupable.length > 0) {
      args.group_by = [groupable[0]];
    }
    args.metrics = (sumIntent || rankIntent) && aggs.length > 0 ? ["sum:" + aggs[0]]
      : avgIntent && aggs.length > 0 ? ["avg:" + aggs[0]] : ["count"];
    if (valueHit) {
      args.where = {};
      args.where[valueHit.f] = valueHit.v;
    } else if (thWhere) {
      args.where = thWhere;
    }
    if (args.group_by || args.where || args.metrics[0] !== "count") {
      sug = { tool: "summarize_records", args: args };
    }
  } else if (valueHit && listIntent) {
    var w = {};
    w[valueHit.f] = valueHit.v;
    sug = { tool: "query_records", args: { where: w, limit: 20 } };
  }
  /* フィールド存在型の質問 (「◯◯が関係する手続は?」等): 候補フィールドが
   * 記入されているレコードの検索を提案する ($not_empty) */
  if (!sug && top.length > 0 && !top[0].aggregatable &&
      /が関係|が関わる|に関わる|が介在|が必要な/.test(question)) {
    var wne = {};
    wne[top[0].f] = { "$not_empty": null };
    sug = { tool: "query_records", args: { where: wne, limit: 20 } };
  }
  /* 次元フィールドそのものを尋ねる質問 (「類型は?」「どんな種類がある?」):
   * 集計語 (ごと/別/内訳…) が無くても、その軸での件数集計を提案する。
   * 「国交省の類型は」が絞り込みだけで終わった実測ギャップへの対処 */
  if (!sug && top.length > 0 && top[0].groupable &&
      /どんな|どのような|種類|色んな|いろんな|は[??]?$/.test(question)) {
    var gargs = { group_by: [top[0].f], metrics: ["count"] };
    if (valueHit) {
      gargs.where = {};
      gargs.where[valueHit.f] = valueHit.v;
    }
    sug = { tool: "summarize_records", args: gargs };
  }
  /* 全体量の質問 (「全部で何件?」等) は総件数の集計を提案する。
   * list のデータセット数を答えてしまう誤りが実測で反復したため */
  if (!sug && /全部で|全体で|総数/.test(question)) {
    sug = { tool: "summarize_records", args: { metrics: ["count"] } };
  }
  /* キーワード検索の提案: 集計系の提案が無く話題語が取れた場合 */
  if (!sug && topic) {
    sug = { tool: "query_records", args: { q: topic, limit: 20 } };
  }
  /* 単語だけの端的な質問 (「オンライン」等): 意図語が無くても、最も近い
   * フィールドで 次元→内訳 / 数値→合計 を提案する。無引数 query の総件数を
   * フィールドの件数として誤答する事故が実測で発生したため */
  if (!sug && top.length > 0 && qn.length <= 10) {
    if (top[0].groupable) {
      sug = { tool: "summarize_records",
              args: { group_by: [top[0].f], metrics: ["count"] } };
    } else if (top[0].aggregatable) {
      sug = { tool: "summarize_records", args: { metrics: ["sum:" + top[0].f] } };
    }
  }
  if (sug) {
    hints.push("呼び出し候補: " + sug.tool + " " + JSON.stringify(sug.args));
  }
  return {
    hints: hints.slice(0, 3),
    suggestion: sug,
    /* linked: 動的スキーマ絞り込み (構造への事前処理) の材料 */
    linked: { fields: top, groupable: groupable, aggs: aggs, valueHit: valueHit },
  };
}

/* リンキング結果で引数生成スキーマを質問ごとに絞り込む (構造への事前処理)。
 * 存在しない列・偽のコード値・数値列への group_by 等の誤りクラスを
 * constrained decoding の段階で構造的に生成不能にする。 */
function narrowedArgsSchema(tool, linked) {
  var base = argsSchemaFor(tool);
  var props = JSON.parse(JSON.stringify(base.properties));
  var allGroupable = [], allAggs = [];
  catalogInfo.forEach(function(c) {
    allGroupable = allGroupable.concat(c.groupable);
    allAggs = allAggs.concat(c.aggregatable);
  });
  /* enum は小さく保つ — 大きな制約は実機で生成ストールを起こす */
  if (props.group_by && allGroupable.length > 0) {
    var gcand = (linked && linked.groupable && linked.groupable.length > 0)
      ? linked.groupable : allGroupable;
    props.group_by = { type: "array", items: { type: "string", enum: gcand.slice(0, 8) } };
  }
  if (props.metrics && allAggs.length > 0) {
    var mvals = ["count"];
    allAggs.slice(0, 3).forEach(function(a) {
      ["sum", "avg"].forEach(function(op) { mvals.push(op + ":" + a); });
    });
    props.metrics = { type: "array", items: { type: "string", enum: mvals } };
  }
  if (props.order_by && linked && linked.aggs && linked.aggs.length > 0) {
    var ovals = [];
    linked.aggs.forEach(function(a) { ovals.push(a); ovals.push("-" + a); });
    props.order_by = { type: "string", enum: ovals };
  }
  if (props.where && linked && linked.fields && linked.fields.length > 0) {
    var wprops = {};
    var wfields = linked.fields.map(function(x) { return x.f; }).slice(0, 3);
    if (linked.valueHit && wfields.indexOf(linked.valueHit.f) < 0) {
      wfields.push(linked.valueHit.f);
    }
    wfields.forEach(function(f) {
      var cl = null;
      catalogInfo.forEach(function(c) {
        if (c.codelists && c.codelists[f]) cl = c.codelists[f];
      });
      /* codelist を持つ列は実在の値しか書けない (enum は8値まで)。無い列は自由入力 */
      wprops[f] = cl ? { type: "string", enum: cl.slice(0, 8) } : {};
    });
    props.where = { type: "object", properties: wprops, additionalProperties: false };
  }
  return { type: "object", properties: props,
           required: base.required, additionalProperties: false };
}

/* 失敗時の「もしかして」: 呼び出しに含まれる未知のフィールド名に対し、
 * カタログから近い正式名を提案してエラーフィードバックに含める。
 * SLM がエラー文から自力で修正案を導く負担を決定的に肩代わりする。 */
function didYouMean(args) {
  var idx = _fieldIndex();
  var names = [];
  (args.group_by || []).forEach(function(f) { names.push(f); });
  if (args.order_by) names.push(String(args.order_by).replace(/^-/, ""));
  if (args.explode) names.push(args.explode);
  if (args.where) names = names.concat(Object.keys(args.where));
  var sugg = [];
  names.forEach(function(n) {
    if (idx[String(n).replace(/[の\s]/g, "")]) return;  // 既知名は対象外
    var nb = _bigrams(n);
    var scored = [];
    catalogInfo.forEach(function(c) {
      (c.allFields || []).forEach(function(f) {
        var s = _dice(nb, _bigrams(f));
        if (s >= 0.2) scored.push({ f: f, s: s });
      });
    });
    scored.sort(function(a, b) { return b.s - a.s; });
    if (scored.length > 0) {
      sugg.push("「" + n + "」→ " +
        scored.slice(0, 2).map(function(x) { return "「" + x.f + "」"; }).join(" か "));
    }
  });
  return sugg;
}

/* SLM が行ったツール呼び出しの記録 (eval モードの採点に使う) */
var toolCallLog = [];

/* クエリ内容の日本語表示 (UI テンプレートの条件表示と同じ記法) */
var _OP_JA = { "$gte": "≧", "$lte": "≦", "$ne": "≠", "$eq": "=",
               "$not_contains": "含まない", "$not_empty": "非空" };
var _AGG_JA = { sum: "合計", avg: "平均", min: "最小", max: "最大" };

function describeQuery(tool, args) {
  args = args || {};
  if (tool === "list_datasets") {
    return "データセット一覧" + (args.q ? "（検索: 「" + args.q + "」）" : "を取得");
  }
  if (tool === "inspect_dataset") {
    return "構造・品質を検査: " + (args.dataset_id || "");
  }
  var parts = [];
  if (tool === "summarize_records") {
    parts.push(args.group_by && args.group_by.length > 0
      ? "集計軸: " + args.group_by.join(" × ") : "全体を集計");
    var ms = (args.metrics || ["count"]).map(function(m) {
      if (m === "count") return "件数";
      var p = String(m).split(":");
      return (_AGG_JA[p[0]] || p[0]) + "(" + p[1] + ")";
    });
    parts.push("指標: " + ms.join(", "));
    if (args.explode) parts.push("展開: " + args.explode);
  }
  if (tool === "query_records") {
    if (args.q) parts.push("検索: 「" + args.q + "」");
    if (Array.isArray(args.select) && args.select.length > 0) {
      parts.push("出力: " + args.select.join(", "));
    }
    if (args.order_by) {
      var desc = String(args.order_by).charAt(0) === "-";
      parts.push("ソート: " + (desc ? String(args.order_by).slice(1) + " (降順)"
                                    : args.order_by + " (昇順)"));
    }
    if (parts.length === 0) parts.push("レコード取得");
  }
  if (args.where && typeof args.where === "object") {
    var conds = Object.keys(args.where).map(function(k) {
      var v = args.where[k];
      if (Array.isArray(v)) return k + " = " + v.join("|");
      if (v && typeof v === "object") {
        return Object.keys(v).map(function(op) {
          return k + " " + (_OP_JA[op] || op) + " " + v[op];
        }).join(", ");
      }
      return k + " ⊃ 「" + v + "」";
    });
    parts.push("絞り込み: " + conds.join(" / "));
  }
  if (args.having) parts.push("集計後フィルタ: " + JSON.stringify(args.having));
  if (args.limit) parts.push("上限: " + args.limit + " 件");
  return parts.join(" ／ ");
}

/* ツールカード (ヘッダー + クエリ内容 + 引数 + UI iframe + 生 JSON) を描画して実行する。
 * extra.orig にモデルの元引数を渡すと、サニタイズ補正が入った場合に差分を表示する */
function runToolWithCard(name, args, extra) {
  extra = extra || {};
  toolCallLog.push({ name: name, arguments: args || {} });
  var histEntry = recordEntry({ kind: "tool", tool: name, query: describeQuery(name, args), args: args });
  var card = document.createElement("div");
  card.className = "tool-card";
  card.innerHTML =
    '<div class="tc-head"><span class="tc-name"></span>' +
    '<span class="tc-state">実行中…</span></div>';
  card.querySelector(".tc-name").textContent = name;

  /* クエリ内容を日本語で常時表示 (ツール名と同じ行)。技術情報は「詳細」に集約 */
  var queryEl = document.createElement("span");
  queryEl.className = "tc-query";
  queryEl.textContent = describeQuery(name, args);
  var headEl = card.querySelector(".tc-head");
  headEl.insertBefore(queryEl, headEl.querySelector(".tc-state"));

  /* 引数の「詳細」はカード生成時に即時追加する — 後続の非同期処理が
   * 失敗しても、何を呼ぼうとしたかは必ず確認できるようにする */
  var detail = document.createElement("details");
  var detailSummary = document.createElement("summary");
  detailSummary.textContent = "詳細";
  detail.appendChild(detailSummary);
  var argsPre = document.createElement("pre");
  argsPre.className = "tc-args";
  argsPre.textContent = "引数:\n" + JSON.stringify(args || {}, null, 1);
  detail.appendChild(argsPre);
  if (extra.orig && JSON.stringify(extra.orig) !== JSON.stringify(args || {})) {
    var fix = document.createElement("div");
    fix.className = "tc-fix";
    fix.textContent = "引数を補正済み — モデル出力: " + JSON.stringify(extra.orig);
    detail.appendChild(fix);
  }
  card.appendChild(detail);

  var host = extra.container || chatEl;
  host.appendChild(card);
  if (host.scrollHeight) host.scrollTop = host.scrollHeight;
  var stateEl = card.querySelector(".tc-state");

  return apiCall(name, args).then(function(result) {
    var data = result.structuredContent || {};
    histEntry.ok = !result.isError;
    /* ツール結果の要約を保存（容量削減）。
     * 履歴復元時に簡易 UI を再構築するのに必要な最小限のデータのみ保持 */
    if (!result.isError) {
      histEntry.summary = summarizeToolResult(name, data);
    }
    persistTranscript();
    if (result.isError) {
      stateEl.textContent = "エラー";
      var errEl = document.createElement("div");
      errEl.className = "msg error";
      errEl.style.margin = "8px";
      errEl.textContent = data.error || JSON.stringify(data);
      card.appendChild(errEl);
      return result;
    }
    stateEl.textContent = "";

    var iframe = document.createElement("iframe");
    /* ツール結果を描画するフレームは sandbox で権限を最小化する。
     * postMessage ブリッジだけで動作するため allow-same-origin は不要 */
    iframe.setAttribute("sandbox", "allow-scripts");
    iframe.src = "/ui/" + TOOL_TEMPLATES[name] + "?theme=light";  // ホストの白基調に揃える
    /* 詳細セクション (引数) → iframe (UI) → 詳細セクション (結果) の順で配置する。
     * iframe 前に詳細を挿入してから iframe を追加すれば、最終的に正しい順序になる */
    card.insertBefore(detail, card.lastChild);  // 詳細を最後から one-before に移動
    card.appendChild(iframe);
    var st = { iframe: iframe, result: result, ready: false };
    frames.set(iframe.contentWindow, st);
    /* サイズは iframe 側 (base.js) が body 実寸を size-changed で通知してくる。
     * ホスト側で scrollHeight を測ると iframe 高さと相互に成長し続けるため測らない */

    var rawPre = document.createElement("pre");
    rawPre.textContent = "structuredContent:\n" + JSON.stringify(data, null, 2);
    detail.appendChild(rawPre);
    card.appendChild(detail);  // 詳細は iframe の下へ移動

    if (host.scrollHeight) host.scrollTop = host.scrollHeight;
    return result;
  }).catch(function(err) {
    stateEl.textContent = "エラー";
    histEntry.ok = false;
    persistTranscript();
    addMsg("error", "ツールを実行できませんでした: " + (err && err.message || err));
    throw err;
  });
}

/* ================= ブラウザ判定 ================= */

function isChrome() {
  return /Chrome\//.test(navigator.userAgent) && !/Edg\//.test(navigator.userAgent);
}

function isEdge() {
  return /Edg\//.test(navigator.userAgent);
}

/* ================= Chrome 内蔵 AI (Prompt API) ================= */

function lmNamespace() {
  if (typeof LanguageModel !== "undefined") return LanguageModel;
  if (typeof window.ai === "object" && window.ai && window.ai.languageModel) {
    return window.ai.languageModel;
  }
  return null;
}

/* create() に渡す言語オプション。公式ガイドラインに従い
 * availability() にも同じオプションを渡して判定を一致させる。 */
var LM_LANG_OPTS = {
  expectedInputs: [{ type: "text", languages: ["ja", "en"] }],
  expectedOutputs: [{ type: "text", languages: ["ja"] }],
};
var useLangOpts = true;

function lmAvailability(ns) {
  if (typeof ns.availability === "function") {
    return Promise.resolve()
      .then(function() {
        /* 言語オプション指定で試行（Chrome/Edge で対応状況が異なる可能性）
         * 失敗したらオプション無しで再試行 */
        return ns.availability(LM_LANG_OPTS).catch(function() {
          return ns.availability();
        });
      })
      .then(function(a) {
        if (a !== "unavailable") {
          useLangOpts = (a === "available" || a === "downloadable");
          return a;
        }
        // availability だけで unavailable の場合、言語オプション無しで再判定
        return ns.availability().then(function(b) {
          useLangOpts = false;
          return b;
        }).catch(function() {
          useLangOpts = false;
          return "unavailable";
        });
      });
  }
  if (typeof ns.capabilities === "function") {
    return ns.capabilities().then(function(c) {
      useLangOpts = false;
      return c.available === "readily" ? "available"
        : c.available === "after-download" ? "downloadable" : "unavailable";
    });
  }
  return Promise.resolve("unavailable");
}

/* エージェントループの継続指示 (few-shot と実ループで同一文言を使う) */
var NEXT_INSTR = "この結果を踏まえ、さらにツールが必要なら tool_call、十分なら answer の JSON を1個だけ返す。";

/* few-shot 例に登場する固有の数値。ツール未実行の回答にこれが含まれていたら
 * パロット (例の数値の丸写し) として差し戻す */
var FEWSHOT_NUMBERS = ["34,567", "34567", "98,765,432", "98765432", "1,234,567", "1234567"];

/* few-shot: 「質問 → 適切なツール呼び出し (クエリ構築) → 回答」に絞った 2 例。
 * データセットの構造・品質はハーネスがシステムプロンプトに注入済みなので、
 * SLM には発見の段取りではなくクエリ構築だけを教える。
 * 値は架空 (A省/B省) にして実データとの混同を防ぐ。 */
function buildFewShot() {
  /* データセット固有の文言は持たず、catalog (list + inspect の結果) から導出する。
   * catalog が取れない場合のみ抽象プレースホルダにフォールバック。 */
  var id = datasetIds[0] || "dataset1";
  var gb = (catalogInfo[0] && catalogInfo[0].groupable[0]) || "フィールドA";
  var gb2 = (catalogInfo[0] && catalogInfo[0].groupable[1]) || "フィールドB";
  function toolMsg(name, digest) {
    return { role: "user", content: "ツール " + name + " の結果(抜粋): " + digest + "\n" + NEXT_INSTR };
  }
  function asst(obj) { return { role: "assistant", content: JSON.stringify(obj) }; }
  var shots = [
    { role: "user", content: gb + "ごとの件数を集計して" },
    asst({ action: "tool_call", tool: "summarize_records",
           arguments: { dataset_id: id, group_by: [gb], metrics: ["count"] } }),
    toolMsg("summarize_records",
      '{"columns":["' + gb + '","count"],"rows":[["A",120],["B",45]],"total_groups":2}'),
    asst({ action: "answer", answer: "件数が最も多いのは A (120件)、次いで B (45件) です。" }),
    { role: "user", content: gb + "ごとに" + gb2 + "の内訳を見せて" },
    asst({ action: "tool_call", tool: "summarize_records",
           arguments: { dataset_id: id, group_by: [gb, gb2], metrics: ["count"] } }),
    toolMsg("summarize_records",
      '{"columns":["' + gb + '","' + gb2 + '","count"],"rows":[["A","X",80],["A","Y",40],["B","X",30]],"total_groups":3}'),
    asst({ action: "answer", answer: "A では X (80件)、Y (40件)。B は X (30件) のみです。" }),
    { role: "user", content: "全部で何件ある?" },
    asst({ action: "tool_call", tool: "summarize_records",
           arguments: { dataset_id: id, metrics: ["count"] } }),
    toolMsg("summarize_records", '{"columns":["count"],"rows":[[34567]],"total_groups":1}'),
    asst({ action: "answer", answer: "全体で 34,567 件です。" }),
    { role: "user", content: "「A」に関するレコードを検索して" },
    asst({ action: "tool_call", tool: "query_records",
           arguments: { dataset_id: id, q: "A", limit: 20 } }),
    toolMsg("query_records",
      '{"total":2,"columns":["名称"],"rows":[["Aの記録1"],["Aの記録2"]]}'),
    asst({ action: "answer", answer: "該当は 2 件です: Aの記録1、Aの記録2。" }),
  ];
  /* sum の例 — 「◯◯の合計」を count で代用する誤りが実測で最多。
   * group_by との複合形にする (単独例では合成できないことが実測で判明) */
  var agg = catalogInfo[0] && catalogInfo[0].aggregatable[0];
  if (agg) {
    shots.push(
      { role: "user", content: gb + "ごとの" + agg + "の合計を出して" },
      asst({ action: "tool_call", tool: "summarize_records",
             arguments: { dataset_id: id, group_by: [gb], metrics: ["sum:" + agg] } }),
      toolMsg("summarize_records",
        '{"columns":["' + gb + '","sum_' + agg + '"],"rows":[["A",98765432],["B",1234567]],"total_groups":2}'),
      asst({ action: "answer",
             answer: "A の合計が最も多く 98,765,432、次いで B (1,234,567) です。" }));
  }
  /* where の例 — 値フィルタを q の文章検索で代用する誤りへの対策 (codelist の実値を使う) */
  var cv = (catalogInfo[0] && catalogInfo[0].codeValues) || {};
  var wf = Object.keys(cv)[0];
  if (wf) {
    var w = {};
    w[wf] = cv[wf];
    shots.push(
      { role: "user", content: wf + "が「" + cv[wf] + "」のレコードを見せて" },
      asst({ action: "tool_call", tool: "query_records",
             arguments: { dataset_id: id, where: w, limit: 20 } }),
      toolMsg("query_records", '{"total":6,"columns":["名称"],"rows":[["レコードC"],["レコードD"]]}'),
      asst({ action: "answer", answer: "該当は 6 件です。例: レコードC、レコードD。" }));
  }
  /* メタ質問の例 — 「ツールで取得できます」と使い方を案内して終わる誤りへの対策 */
  var f3 = catalogInfo[0] ? catalogInfo[0].allFields.slice(0, 3) : [];
  shots.push(
    { role: "user", content: "どんなフィールドがある?" },
    asst({ action: "tool_call", tool: "inspect_dataset", arguments: { dataset_id: id } }),
    toolMsg("inspect_dataset",
      '{"dataset_id":"' + id + '","fields":"' + (f3.join("|") || "…") + '|…"}'),
    asst({ action: "answer",
           answer: "主なフィールドは " + (f3.join("、") || "…") + " などです。" }));
  return shots;
}

function createSession(onProgress) {
  var monitor = function(m) {
    m.addEventListener("downloadprogress", function(e) {
      onProgress(e.loaded || 0);
    });
  };
  var base = {
    initialPrompts: [{ role: "system", content: systemPrompt }].concat(buildFewShot()),
    monitor: monitor,
  };
  var lang = useLangOpts ? LM_LANG_OPTS : {};
  /* 出力が決定的なほどツール引数の精度が上がる。sampling 指定・言語指定・
   * initialPrompts に対応しない環境の順にフォールバックする */
  var attempts = [
    Object.assign({}, base, lang, { temperature: 0, topK: 1 }),
    Object.assign({}, base, lang),
    base,
    { systemPrompt: systemPrompt, monitor: monitor },
  ];
  function tryAt(i) {
    return LM.create(attempts[i]).catch(function(err) {
      if (i + 1 < attempts.length) return tryAt(i + 1);
      throw err;
    });
  }
  return tryAt(0);
}

/* ── モデルダウンロード UI (公式 do's and don'ts 準拠) ──
 * - ダウンロードはバナーのボタン押下 (user activation) でのみ開始する
 * - <progress> で進捗を表示し、DL 完了後の展開・ロード中は indeterminate にする
 * - 準備が完了するまでチャットは「利用可能」にしない */
var dlBanner = document.getElementById("dl-banner");
var dlText = document.getElementById("dl-text");
var dlBtn = document.getElementById("dl-btn");
var dlProgress = document.getElementById("dl-progress");
var dlLabel = document.getElementById("dl-label");

function showDownloadBanner(availState) {
  dlBanner.hidden = false;
  var modelName = isEdge() ? "モデル (Phi-mini)" : "モデル (Gemini Nano)";
  if (availState === "downloading") {
    dlText.textContent = modelName + " をダウンロード中です。準備が完了するとチャットを利用できます。";
    dlBtn.textContent = "進捗を表示して準備を続ける";
  } else {
    dlText.textContent = "チャットには内蔵 AI " + modelName + " のダウンロードが必要です。下のボタンで開始してください。";
    dlBtn.textContent = modelName + " をダウンロードして開始";
  }
}

function markDlProgress(loaded) {
  dlProgress.hidden = false;
  if (loaded >= 1) {
    // DL 完了 → 展開・メモリロード待ち (所要時間不定のため indeterminate)
    dlProgress.removeAttribute("value");
    dlLabel.textContent = "モデルを展開・読み込み中…";
  } else {
    dlProgress.value = loaded;
    dlLabel.textContent = "ダウンロード中… " + Math.round(loaded * 100) + "%";
  }
}

dlBtn.addEventListener("click", function() {
  if (navigator.userActivation && !navigator.userActivation.isActive) {
    // create() はユーザー操作直後でないとダウンロードを開始できない
    dlLabel.textContent = "ページを操作してからもう一度押してください。";
    return;
  }
  dlBtn.disabled = true;
  dlProgress.removeAttribute("value");
  dlProgress.hidden = false;
  dlLabel.textContent = "準備中…";
  ensureSession().then(function() {
    dlBanner.hidden = true;
    lmReady = true;
    sendBtn.disabled = busy;
    inputEl.placeholder = defaultPlaceholder();
    addMsg("note", "モデルの準備ができました。質問をどうぞ。");
    if (isEvalMode()) { runEval(); return; }
    inputEl.focus();
  }).catch(function(err) {
    dlBtn.disabled = false;
    dlProgress.hidden = true;
    dlLabel.textContent = "ダウンロードできませんでした: " + (err && err.message || err) +
      " (空きストレージ 22GB 以上が必要です)";
  });
});

var baseSession = null;  // initialPrompts 直後の純粋な状態 (clone の親)

function ensureSession() {
  if (session) return Promise.resolve(session);
  if (baseSession) { session = baseSession; return Promise.resolve(session); }
  return createSession(markDlProgress).then(function(s) {
    baseSession = s;
    session = s;
    var modelMsg = isEdge() ? "Phi-mini" : "Gemini Nano";
    setStatus("内蔵 AI: 利用可能 (" + modelMsg + ")", "ok");
    return s;
  });
}

/* ターン開始時に base の clone で文脈をリセットする。
 * Nano のコンテキスト (~9K トークン共有) は超過すると古いターンから
 * 静かに切り捨てられ、システムプロンプトごと崩れて挙動が不安定になる。
 * そのため質問 (eval ケース) ごとに base の clone = 新鮮な文脈で始める。
 * clone は再 create よりはるかに安価。clone 非対応環境は据え置き。 */
function freshSession() {
  lastTurnCall = null;  // eval のケース間で文脈を持ち越さない
  return ensureSession().then(function() {
    if (!baseSession || typeof baseSession.clone !== "function") return session;
    var old = session !== baseSession ? session : null;
    return Promise.resolve(baseSession.clone()).then(function(s) {
      if (old && typeof old.destroy === "function") {
        try { old.destroy(); } catch (e) { /* noop */ }
      }
      session = s;
      return s;
    }).catch(function() { return session; });
  });
}

function sessionUsageRatio(s) {
  if (!s) return null;
  if (s.inputUsage != null && s.inputQuota) return s.inputUsage / s.inputQuota;
  if (s.tokensSoFar != null && s.maxTokens) return s.tokensSoFar / s.maxTokens;
  return null;
}

/* ================= Thinking Zone 管理 ================= */

function resetSession(reason) {
  [session, baseSession].forEach(function(s) {
    if (s && typeof s.destroy === "function") {
      try { s.destroy(); } catch (e) { /* noop */ }
    }
  });
  session = null;
  baseSession = null;
  if (reason) addMsg("note", reason);
}

/* モデル呼び出しの watchdog: 生成がスタックすると eval 全体が固まるため、
 * 一定時間で abort して失敗扱いにする。?ptimeout=ms で上書き可 (テスト用)。 */
var PROMPT_TIMEOUT_MS = (function() {
  var v = parseInt(new URLSearchParams(location.search).get("ptimeout"), 10);
  return isNaN(v) || v <= 0 ? 60000 : v;
})();

function humanizeError(err) {
  var msg = (err && err.message) || String(err) || "予期しないエラーが発生しました";
  var errorMap = {
    "kErrorUnknown": "内蔵 AI でエラーが発生しました。もう一度試してください。",
    "NotSupportedError": "このブラウザは内蔵 AI に対応していません。Chrome か Edge を使用してください。",
    "NotAllowedError": "内蔵 AI の使用が許可されていません。",
    "QuotaExceededError": "コンテキストサイズが超過しました。別の質問を試してください。",
  };
  for (var key in errorMap) {
    if (msg.indexOf(key) >= 0) return errorMap[key];
  }
  return msg.length > 200 ? msg.slice(0, 200) + "…" : msg;
}

function promptWithTimeout(text, opts, timeoutMs) {
  var limit = timeoutMs || PROMPT_TIMEOUT_MS;
  var ctrl = (typeof AbortController !== "undefined") ? new AbortController() : null;
  var merged = Object.assign({}, opts || {});
  if (ctrl) merged.signal = ctrl.signal;

  return new Promise(function(resolve, reject) {
    var timer = setTimeout(function() {
      if (ctrl) { try { ctrl.abort(); } catch (e) { /* noop */ } }
      reject(new Error("モデル応答がタイムアウトしました (" + Math.round(limit / 1000) + "s)"));
    }, limit);
    session.prompt(text, merged).then(
      function(r) {
        clearTimeout(timer);

        resolve(r);
      },
      function(e) {
        clearTimeout(timer);
        // kErrorUnknown は処理が成功しているので無視
        if (e && e.message && e.message.indexOf("kErrorUnknown") >= 0) {
          console.debug("Prompt API: kErrorUnknown (実処理は成功)", e);
          resolve("");  // エラーを抑制、処理続行
          return;
        }
        addMsg("error", humanizeError(e));
        console.error("LLM Error:", e);
        reject(e);
      });
  });
}

/* 構造化出力の段階フォールバック:
 * tier 0 = 簡易スキーマ (JSON 妥当性を保証)
 * tier 1 = プレーン出力 (最後の手段 — JSON 修復が増える)
 * エスカレートは通知し、記録する。 */
var _schemaTier = 0;
var _stallCount = 0;  // 連続タイムアウト数 (2回で制約を外す)

function _constraintFor(tier) {
  if (tier === 0) return ACTION_SCHEMA_SIMPLE;
  return null;
}

function lmPrompt(text, retried) {
  var exec = function() {
    var schema = _constraintFor(_schemaTier);
    var p = schema
