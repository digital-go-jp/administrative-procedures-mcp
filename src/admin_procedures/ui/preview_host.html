      ? promptWithTimeout(text, { responseConstraint: schema })
      : promptWithTimeout(text);
    return p.then(function(r) {
      _stallCount = 0;  // 正常応答でリセット
      return r;
    }).catch(function(err) {
      if (schema && err && (err.name === "NotSupportedError" || err.name === "TypeError")) {
        _schemaTier++;
        addMsg("note", "構造化出力のスキーマが拒否されたためレベルを下げます (tier " +
          _schemaTier + "): " + (err.message || err.name));
        return exec();
      }
      /* 生成ストール (タイムアウト) が続く場合は制約を外して復旧を試みる */
      if (schema && err && /タイムアウト/.test(String(err.message || ""))) {
        _stallCount++;
        if (_stallCount >= 2) {
          _schemaTier++;
          _stallCount = 0;
          addMsg("note", "生成ストールが続くため構造化出力を無効化します (tier " + _schemaTier + ")");
        }
      }
      throw err;
    });
  };
  return exec().catch(function(err) {
    if (err && err.name === "QuotaExceededError") {
      // コンテキスト超過 → セッションを作り直して一度だけ再試行 (履歴は失われる)
      resetSession("コンテキスト上限に達したためセッションをリセットしました。");
      return ensureSession().then(function() { return promptWithTimeout(text); });
    }
    /* Prompt API の内部エラー (kErrorUnknown 等の一過性障害) は
     * セッションを作り直して一度だけ再試行する */
    if (!retried && err && /unknown|invalidstate/i.test(String(err.message || err.name || ""))) {
      addMsg("note", "モデル内部エラーのためセッションを作り直して再試行します");
      resetSession(null);
      return ensureSession().then(function() { return lmPrompt(text, true); });
    }
    throw err;
  });
}

/* モデル応答から最初の JSON オブジェクトを取り出す (汎用) */
function _extractJson(raw) {
  if (!raw) return null;
  var s = String(raw).trim()
    .replace(/^```(?:json)?/i, "").replace(/```\s*$/, "").trim();
  var start = s.indexOf("{");
  if (start === -1) return null;
  var depth = 0, inStr = false, esc = false;
  for (var i = start; i < s.length; i++) {
    var ch = s[i];
    if (inStr) {
      if (esc) esc = false;
      else if (ch === "\\") esc = true;
      else if (ch === '"') inStr = false;
      continue;
    }
    if (ch === '"') inStr = true;
    else if (ch === "{") depth++;
    else if (ch === "}") {
      depth--;
      if (depth === 0) {
        try { return JSON.parse(s.slice(start, i + 1)); } catch (e) { return null; }
      }
    }
  }
  return null;
}

function parseAction(raw) {
  return _extractJson(raw);
}

/* 途中で切れた回答 JSON ('{"action":"answer","answer":"…' が閉じない) から
 * 本文だけを救出する。生 JSON がそのまま画面に出る事故の回避 */
function salvageAnswer(raw) {
  var m = String(raw).match(/"answer"\s*:\s*"((?:[^"\\]|\\.)*)/);
  if (m && m[1] && m[1].length >= 10) {
    try { return JSON.parse('"' + m[1] + '"'); } catch (e) { return m[1]; }
  }
  return null;
}

/* ── 二段階フロー (?flow=2): ツール選択 → 引数生成 ──
 * 各段階を専用スキーマで constrained decoding する:
 *   1. ツール選択 = 4択 enum (構造的にミス不能)
 *   2. 引数生成 = そのツール専用スキーマ (無関係キーは構造的に出せない)
 * 単段フローとの A/B 測定用。 */

function flowTwoStep() {
  /* スイート測定 (19問×4構成) で二段階+ヒントが最良 (89% vs 単段 79%) だったため
   * 既定を二段階にする。?flow=1 で単段に戻せる。 */
  return cfgParam("flow") !== "1";
}

function argsSchemaFor(tool) {
  var props = {};
  Object.keys(TOOL_PARAMS[tool] || {}).forEach(function(k) {
    if (ARGS_SCHEMA.properties[k]) props[k] = ARGS_SCHEMA.properties[k];
  });
  return {
    type: "object",
    properties: props,
    required: tool === "list_datasets" ? [] : ["dataset_id"],
    additionalProperties: false,
  };
}

/* 二段階フローの各ステージは 30 秒で切り上げる (フォールバックを速くする) */
var STAGE_TIMEOUT_MS = 30000;

function promptJSON(text, schema, fallbackSchema) {
  var call = schema
    ? promptWithTimeout(text, { responseConstraint: schema }, STAGE_TIMEOUT_MS)
    : promptWithTimeout(text, null, STAGE_TIMEOUT_MS);
  return call.catch(function(err) {
    if (schema && err && (err.name === "NotSupportedError" || err.name === "TypeError")) {
      // 絞り込みスキーマが拒否されたら基本スキーマ → プレーンの順に段階フォールバック
      return promptJSON(text, fallbackSchema || null);
    }
    throw err;
  }).then(function(raw) {
    return typeof raw === "object" && raw !== null ? raw : _extractJson(String(raw));
  });
}

/* 質問 → action JSON 文字列 (既存パイプラインにそのまま流せる形で返す)。
 * 選択失敗時は単段フローへフォールバック。 */
var _argsSchemaBroken = false;  // 引数ステージが一度失敗したら以後は軽いスキーマで生成する

/* Chrome 内蔵モデルの内部エラー等を短い日本語説明付きの文字列にする */
function friendlyErr(err) {
  var m = String(err && err.message || err || "");
  if (/kErrorUnknown|unknown error|InvalidStateError/i.test(m)) {
    return "内蔵 AI の内部エラー (Chrome 側で処理が中断されました): " + m;
  }
  return m;
}

function twoPhaseAction(promptText, linked, suggestion) {
  var TOOL_SELECT_SCHEMA = {
    type: "object",
    properties: { tool: { type: "string", enum: Object.keys(TOOL_TEMPLATES) } },
    required: ["tool"],
    additionalProperties: false,
  };
  var selStep = stepStart("使うツールを選択中");
  return promptJSON("次の質問に使うツールを1つ選ぶ。\n" + promptText, TOOL_SELECT_SCHEMA)
    .then(function(sel) {
      var tool = sel && sel.tool;
      if (!tool || !TOOL_TEMPLATES[tool]) {
        selStep.done("単段へ切替", JSON.stringify(sel));
        return lmPrompt(promptText);
      }
      selStep.done("ツール選択: " + tool, JSON.stringify(sel));
      /* 引数生成は「絞り込みスキーマ → 基本スキーマ → プレーン」の段階制約。
       * 一度ストールした環境では絞り込みを省いて軽く生成する */
      var argStep = stepStart("引数を生成中");
      var schema = _argsSchemaBroken ? argsSchemaFor(tool) : narrowedArgsSchema(tool, linked);
      return promptJSON("ツール " + tool + " を呼ぶための引数の JSON を出力する。\n" + promptText,
                        schema, argsSchemaFor(tool))
        .then(function(args) {
          argStep.done("引数を生成", JSON.stringify(args || {}, null, 1));
          return JSON.stringify({ action: "tool_call", tool: tool, arguments: args || {} });
        })
        .catch(function(err) {
          _argsSchemaBroken = true;
          /* 呼び出し候補が同じツールなら、その引数で即続行 (待ち時間ゼロの決定的フォールバック) */
          if (suggestion && suggestion.tool === tool) {
            argStep.done("候補引数で続行", friendlyErr(err));
            return JSON.stringify({ action: "tool_call", tool: tool,
                                    arguments: suggestion.args || {} });
          }
          argStep.done("単段へ切替", friendlyErr(err));
          return lmPrompt(promptText);
        });
    })
    .catch(function(err) {
      selStep.done("単段へ切替", friendlyErr(err));
      return lmPrompt(promptText);
    });
}

/* ツール結果から要約を抽出（localStorage 容量削減用）。
 * 完全なデータではなく、UI 再構築に必要な最小限のデータのみ保持 */
function summarizeToolResult(name, data) {
  if (!data) return null;
  var summary = { tool: name };
  if (name === "query_records") {
    summary.total = data.total;
    summary.columns = data.columns;
    summary.rows = Array.isArray(data.rows) ? data.rows.slice(0, 3) : [];  // 最初の3行のみ
    if (data.hint) summary.hint = data.hint;
  } else if (name === "summarize_records") {
    summary.total_group_count = data.total_group_count;
    summary.columns = data.columns;
    summary.rows = Array.isArray(data.rows) ? data.rows.slice(0, 5) : [];  // 最初の5行のみ
  } else if (name === "list_datasets") {
    summary.datasets = Array.isArray(data.datasets) ? data.datasets.slice(0, 3) : [];
  } else {
    /* inspect_dataset 等は最小のフィールド表でも 1KB を超えやすい。
     * 空データとして復元せず、省略済みであることを明示する。 */
    return {
      _truncated: true,
      tool: name,
      dataset_id: data.dataset_id,
      record_count: data.record_count,
    };
  }
  var s = JSON.stringify(summary);
  if (s.length <= 1024) return summary;
  return {
    _truncated: true,
    tool: name,
    dataset_id: data.dataset_id,
    total: data.total,
    total_group_count: data.total_group_count,
    record_count: data.record_count,
  };
}

/* ツール結果をモデルに返す抜粋 (Gemini Nano のコンテキストは小さい) */
function digestForModel(name, data) {
  /* inspect_dataset はフィールド一覧が以降の group_by / where 指定の生命線
   * なので行を切り詰めない。代わりに desc 等の長文列を落とし、
   * 品質判断に必要な列 (fill_rate, groupable 等) だけ残す。 */
  if (name === "inspect_dataset" && Array.isArray(data.columns) && Array.isArray(data.rows)) {
    /* システムプロンプトに同じフィールド表 (codelist 含む) を注入済みの
     * データセットでは要約だけ返す。フルの再送はコンテキストを圧迫し、
     * 次応答の 90s タイムアウトを実測で引き起こした。 */
    var catalogEntry = null;
    catalogInfo.forEach(function(c) {
      if (c.dataset_id === data.dataset_id && (c.allFields || []).length > 0) catalogEntry = c;
    });
    if (catalogEntry) {
      var dc = {
        dataset_id: data.dataset_id,
        record_count: data.record_count != null ? data.record_count : data.total,
        fields: catalogEntry.allFields.join("|"),
        note: "各フィールドの型・品質・値はシステムプロンプトの ## データセット を参照。フィールド名は上記の表記をそのまま使う。この後、元の質問に答えるために summarize_records か query_records を必ず呼ぶ。",
      };
      var sc = JSON.stringify(dc);
      return sc.length > 2500 ? sc.slice(0, 2500) + "…" : sc;
    }
    var keep = ["id", "role", "type", "groupable", "aggregatable", "multi_value", "fill_rate", "codelist"];
    var idx = [];
    keep.forEach(function(k) {
      var i = data.columns.indexOf(k);
      if (i >= 0) idx.push(i);
    });
    var di = { dataset_id: data.dataset_id };
    ["record_count", "total", "notes", "quality_summary"].forEach(function(k) {
      if (data[k] != null) di[k] = data[k];
    });
    di.columns = idx.map(function(i) { return data.columns[i]; });
    di.rows = data.rows.slice(0, 60).map(function(r) {
      return idx.map(function(i) {
        var cell = (r || [])[i];
        if (cell == null) return null;
        // codelist 等の長い配列セルは先頭のみ (コンテキスト節約)
        if (Array.isArray(cell) && cell.length > 6) {
          return cell.slice(0, 6).concat(["…他" + (cell.length - 6) + "件"]);
        }
        return cell;
      });
    });
    var si = JSON.stringify(di);
    return si.length > 6000 ? si.slice(0, 6000) + "…" : si;
  }

  var ROWS = 12, COLS = 12;
  function trunc(v) {
    if (Array.isArray(v)) {
      var out = v.slice(0, ROWS).map(trunc);
      if (v.length > ROWS) out.push("…他" + (v.length - ROWS) + "件");
      return out;
    }
    if (v && typeof v === "object") {
      var o = {};
      Object.keys(v).forEach(function(k) {
        if (k === "field_metadata") return; // 表示用メタデータはモデルに不要
        o[k] = trunc(v[k]);
      });
      return o;
    }
    if (typeof v === "string" && v.length > 200) return v.slice(0, 200) + "…";
    return v;
  }
  var d = trunc(data);
  if (Array.isArray(data.columns) && Array.isArray(data.rows)) {
    d.columns = data.columns.slice(0, COLS);
    d.rows = data.rows.slice(0, ROWS).map(function(r) { return (r || []).slice(0, COLS); });
    if (data.columns.length > COLS) d.columns_omitted = data.columns.length - COLS;
    if (data.rows.length > ROWS) d.rows_omitted = data.rows.length - ROWS;
  }
  /* ツール結果のメタデータ (hint, notes, error_detail) を保持する
   * これにより、次回の再試行時に LLM がヒントを参照できる */
  if (data.hint) d.hint = data.hint;
  if (data.notes) d.notes = data.notes;
  if (data.error_detail) d.error_detail = data.error_detail;
  var s = JSON.stringify(d);
  return s.length > 3500 ? s.slice(0, 3500) + "…" : s;
}

/* ================= エージェントループ ================= */

var lastTurnStats = null;   // 直近ターンの診断情報 (eval が結果に添付する)
var lastTurnAnswer = null;  // 直近ターンの最終回答 (未回答ターンは null のまま —
                            // DOM から拾うと前ケースの回答が混入するため)
var lastTurnCall = null;    // 直近ターンの最後に成功したツール呼び出し {tool, args}
                            // (次ターンの文脈参照・「そのうち」等の絞り込み継続に使う)

/* 照応表現 (「そのうち」「その中で」等) の検出 */
function _anaphoric(q) {
  return /そのうち|その中|これら|それら|同じ条件|さらに/.test(q);
}

/* 照応表現を検出したら、継続すべき直前ターンの絞り込み (where) を返す */
function continuationWhere(question) {
  var w = lastTurnCall && lastTurnCall.args && lastTurnCall.args.where;
  if (!w || Object.keys(w).length === 0) return null;
  return _anaphoric(question) ? w : null;
}

/* CoT (plan-then-act): 制約付き出力の前に短い計画を自由文で書かせる。
 * 102 問 eval の実測で有害と判明 (計画を書いた時点で満足し、ツールを呼ばず
 * 架空の数値で直答する — no_call 35件/正答率 38%)。既定オフ。
 * ?cot=1 で実験用に有効化できる。 */
function cotEnabled() {
  return cfgParam("cot") === "1";
}
var PLAN_INSTR = "次の質問に答えるための計画を1行だけ書く: 使うツール名と、" +
  "group_by / where / q に入れるフィールド名や値。" +
  "使うフィールドの記入率が低い (## データセット参照) 場合は「記入率注意」も書く。" +
  "JSON は書かない。\n質問: ";

/* 質問との関連度でデータセットを順位付けする (タイトル・ID の文字一致)。
 * データセット固有の知識は使わない汎用ロジック */
function rankDatasets(question) {
  var qb = _bigrams(question);
  return datasetList.map(function(d) {
    var title = String(d.title || "");
    var score = _dice(qb, _bigrams(title + " " + d.dataset_id));
    var lcs = _lcsLen(question, title);
    if (lcs >= 3) score += lcs / 10;  // タイトルの部分語一致は加点
    return { d: d, score: score };
  }).sort(function(a, b) { return b.score - a.score; });
}

/* 多データセット時: 質問に関連する上位データセットの構造・品質を都度取得し、
 * catalogInfo を関連順に並べ替える (inspect 済みは再利用。可視のツール実行) */
function ensureCatalogFor(question) {
  if (datasetList.length === 0 ||
      catalogInfo.length >= datasetList.length) return Promise.resolve();
  var ranked = rankDatasets(question);
  var top = ranked.slice(0, 2).filter(function(r) { return r.score > 0.1; });
  if (top.length === 0) top = ranked.slice(0, 1);  // 汎用質問は先頭データセット
  var changed = false;
  return top.reduce(function(p, r) {
    var d = r.d;
    return p.then(function() {
      if (catalogInfo.some(function(c) { return c.dataset_id === d.dataset_id; })) return;
      var key = "apcli-preview:catalog4:" + d.dataset_id;
      return runToolWithCard("inspect_dataset", { dataset_id: d.dataset_id })
        .then(function(res) {
          var entry = extractCatalogEntry(d, res.structuredContent || null);
          lsSet(key, { at: Date.now(), entry: entry });
          catalogInfo.push(entry);
          changed = true;
        })
        .catch(function() {
          var cached = lsGet(key);
          if (cached && cached.entry) {
            addMsg("note", "inspect を実行できなかったため「" + d.dataset_id +
              "」はローカル保存済みの構造・品質情報で継続します");
            catalogInfo.push(cached.entry);
            changed = true;
          }
        });
    });
  }, Promise.resolve()).then(function() {
    /* 関連順に並べ替え: catalogInfo[0] が提案・dataset_id 補完の基準になる */
    var order = {};
    ranked.forEach(function(r, i) { order[r.d.dataset_id] = i; });
    catalogInfo.sort(function(a, b) {
      var oa = order[a.dataset_id] != null ? order[a.dataset_id] : 999;
      var ob = order[b.dataset_id] != null ? order[b.dataset_id] : 999;
      return oa - ob;
    });
    if (changed) {
      systemPrompt = buildSystemPrompt(describeData || {});
      if (lmReady) {
        resetSession(null);  // 新カタログ入りのプロンプトで作り直す
        return ensureSession();
      }
    }
  });
}

/* ── CQR: 文脈込み書き直し (?cqr=1, 実験) ──
 * 照応・省略を含むフォローアップ質問を、直前ターンの呼び出しを踏まえた
 * 自己完結の質問に書き直してから通常パイプラインに流す (CQR-SQL 方式)。
 * 書き直した質問にはフィールドヒント・引用形式の解釈がフルに効く。
 * 書き直しにモデルを1回使うため既定オフ — 効果は eval で測ってから昇格する */
function cqrEnabled() {
  return cfgParam("cqr") === "1";
}

/* 使い捨てセッション (baseSession の clone) で1回だけ実行する。
 * 本会話のセッション履歴に書き直しのメタ指示を残さないため */
function promptOneShot(text, timeoutMs) {
  if (!baseSession || typeof baseSession.clone !== "function") {
    return promptWithTimeout(text, {}, timeoutMs);
  }
  return Promise.resolve(baseSession.clone()).then(function(s) {
    var ctrl = (typeof AbortController !== "undefined") ? new AbortController() : null;
    var p = new Promise(function(resolve, reject) {
      var timer = setTimeout(function() {
        if (ctrl) { try { ctrl.abort(); } catch (e) { /* noop */ } }
        reject(new Error("書き直しがタイムアウトしました"));
      }, timeoutMs || 20000);
      s.prompt(text, ctrl ? { signal: ctrl.signal } : {}).then(function(r) {
        clearTimeout(timer); resolve(r);
      }, function(e) { clearTimeout(timer); reject(e); });
    });
    var cleanup = function() { try { if (s.destroy) s.destroy(); } catch (e) { /* noop */ } };
    return p.then(function(r) { cleanup(); return r; }, function(e) { cleanup(); throw e; });
  });
}

function reformulateQuestion(userText) {
  var instr = "次のフォローアップ質問を、文脈が無くても意味が通る自己完結の質問1文に書き直す。" +
    "「そのうち」「それら」等の指示語は、直前の呼び出しの絞り込み条件を明示して置き換える。" +
    "新しい条件を発明しない。書き直した質問文だけを出力する。\n" +
    "直前の呼び出し: " + lastTurnCall.tool + " " + JSON.stringify(lastTurnCall.args || {}) +
    "\nフォローアップ質問: " + userText;
  return promptOneShot(instr, 20000).then(function(raw) {
    var q = String(raw || "").trim().split("\n")[0].trim();
    /* ガード: 短すぎ・長すぎ・JSON 断片らしき出力は棄却して元の質問で進む */
    if (q.length < 8 || q.length > 200 || /[{}\[\]"]/.test(q)) return userText;
    addMsg("note", "文脈を補って解釈: " + q);
    return q;
  }).catch(function() { return userText; });
}

function agentTurn(userText) {
  return ensureCatalogFor(userText).then(function() {
    /* CQR 有効時: 照応表現のあるフォローアップは書き直してから流す。
     * 書き直しに失敗しても元の質問 + 従来の where 継続で進める */
    if (cqrEnabled() && lastTurnCall && _anaphoric(userText)) {
      return reformulateQuestion(userText).then(_agentTurnRun);
    }
    return _agentTurnRun(userText);
  });
}

function _agentTurnRun(userText) {
  var prompt = userText;
  /* ハーネスによるフィールド候補 (カタログ突合) と蓄積観測を添える (逐次参照)。
   * あくまで参考情報 — tool-first 強制により、これだけで直答はさせない */
  var fh = fieldHints(userText);
  var refs = fh.hints.concat(observationHints(userText));
  var suggestion = fh.suggestion;  // 部分コピー対策のマージに使う
  /* 文脈参照: 直前ターンのツール呼び出しをプロンプトに添えて参照可能にし、
   * 照応表現 (「そのうち」等) があれば絞り込みを呼び出し候補にも引き継ぐ */
  var contWhere = null;
  if (lastTurnCall) {
    refs.push("直前の呼び出し: " + lastTurnCall.tool + " " +
      JSON.stringify(lastTurnCall.args || {}).slice(0, 200));
    contWhere = continuationWhere(userText);
    if (contWhere && suggestion) {
      suggestion.args.where = Object.assign({}, contWhere, suggestion.args.where || {});
    }
  }
  if (refs.length > 0) {
    // ヒントはプロンプトにのみ添付する (画面には出さない — stats.refs で追跡可能)
    prompt = userText + "\n参考: " + refs.join(" / ");
  }
  var statsRefs = refs;  // 診断用: 添付したヒントを結果に記録する
  var step = 0;
  var repairTried = false;
  var stats = { steps: 0, repaired: false, refs: statsRefs };
  lastTurnStats = stats;
  lastTurnAnswer = null;
  beginTurnSteps();  // 進行ステップの表示先をこのターン用に用意
  var pendingLesson = null;  // 直前の失敗呼び出し (成功が続けば followup を記録)
  var turnCalls = [];  // このターンで実行したツール呼び出し
  var nudges = 0;      // ツール未使用の直答への差し戻し回数 (最大2)
  var repeatNudged = false;  // 同一呼び出し反復への差し戻しは1回まで

  /* ターン完了をサーバーへライブ記録する (turns.jsonl)。
   * 外部からチャットの Q → クエリ → A を追跡できるようにする */
  function logTurn(answerText) {
    try {
      fetch("/api/turn-log", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          q: userText,
          calls: turnCalls.map(function(c) {
            return { tool: c.tool, query: describeQuery(c.tool, c.args), ok: c.ok !== false };
          }),
          answer: String(answerText || "").slice(0, 300),
        }),
      }).catch(function() { /* noop */ });
    } catch (e) { /* noop */ }
  }

  function next() {
    step++;
    stats.steps = step;
    var genStep = null;
    var pre = Promise.resolve(prompt);
    if (step === 1 && cotEnabled()) {
      pre = promptWithTimeout(PLAN_INSTR + prompt).then(function(plan) {
        plan = String(plan).trim().slice(0, 200);
        stats.plan = plan;
        return prompt + "\n計画: " + plan + "\n計画に従い、出力形式どおりの JSON を1個出力する。";
      }).catch(function() { return prompt; });
    }
    return pre.then(function(p) {
      // 二段階フロー: 初手のみ「ツール選択 → 引数生成」に分割 (以降の継続判断は単段)
      if (step === 1 && flowTwoStep()) {
        stats.flow = 2;
        return twoPhaseAction(p, fh.linked, suggestion);
      }
      genStep = stepStart(step === 1 ? "応答を生成中" : "結果を検討して次の行動を決定中");
      return lmPrompt(p);
    }).then(function(raw) {
      if (genStep) genStep.done("モデル応答を受信", String(raw).slice(0, 600));
      var act = parseAction(raw);
      if (!act || (act.action !== "tool_call" && act.action !== "answer")) {
        /* 途中で切れた回答 JSON なら本文を救出してそのまま回答にする */
        var salvaged = salvageAnswer(raw);
        if (salvaged) {
          act = { action: "answer", answer: salvaged };
        }
      }
      if (!act || (act.action !== "tool_call" && act.action !== "answer")) {
        // 壊れた JSON は一度だけ修復を促す ("limit**: 10" 等が実測で発生)
        if (!repairTried && step < MAX_STEPS) {
          repairTried = true;
          stats.repaired = true;
          addMsg("note", "応答が JSON 形式になっていなかったため、出力し直しを依頼しました");
          prompt = "直前の出力は JSON として解釈できませんでした。同じ内容を正しい JSON オブジェクト1個" +
            ' ({"action":"tool_call",...} または {"action":"answer",...}) だけで出力し直す。';
          return next();
        }
        // 修復しても JSON でない応答はそのまま回答として表示
        lastTurnAnswer = String(raw).trim();
        addMsg("assistant", lastTurnAnswer);
        logTurn(lastTurnAnswer);
        return;
      }
      if (act.action === "answer" || !act.tool) {
        /* ツールを一度も呼ばない直答は強制差し戻す。
         * 「計画で満足して架空の数値で直答する」失敗 (実測 35/102 件) への
         * 決定的な対策。2回目も直答なら受け入れる (挨拶等の非データ質問)。
         * ただし few-shot 例の数値をパロットしている場合はもう1回だけ差し戻す
         * (ハーネスは自分が作った例の数値を知っているので検出できる)。 */
        var answerText = act.answer || "";
        /* {"action":"answer"} だけで本文が無い応答 (実測で発生) は出力し直しを求める */
        if (answerText === "" && !repairTried && step < MAX_STEPS) {
          repairTried = true;
          stats.repaired = true;
          addMsg("note", "回答本文が空だったため出力し直しを求めました");
          prompt = '回答の本文を {"action":"answer","answer":"回答本文"} の answer に入れて出力し直す。';
          return next();
        }
        if (answerText === "") answerText = String(raw).trim();
        if (turnCalls.length === 0 && step < MAX_STEPS) {
          if (nudges === 0) {
            nudges++;
            stats.tool_nudged = nudges;
            addMsg("note", "ツール未実行の直答だったため差し戻しました");
            prompt = "回答の前に必ずツールでデータを確認する。" +
              '{"action":"tool_call","tool":"...","arguments":{...}} の JSON を1個返す。質問: ' + userText;
            return next();
          }
          var parroted = FEWSHOT_NUMBERS.some(function(n) {
            return answerText.indexOf(n) >= 0;
          });
          if (parroted && nudges < 2) {
            nudges++;
            stats.tool_nudged = nudges;
            addMsg("note", "会話例の数値のパロットを検出したため差し戻しました");
            prompt = "その数値は会話例のものであり実データではない。" +
              "必ずツールでデータを取得してから答える。tool_call の JSON を1個返す。質問: " + userText;
            return next();
          }
        }
        /* 次ターンの文脈参照用に、最後に成功した呼び出しを記録する */
        for (var ti = turnCalls.length - 1; ti >= 0; ti--) {
          if (turnCalls[ti].ok) {
            lastTurnCall = { tool: turnCalls[ti].tool, args: turnCalls[ti].args };
            break;
          }
        }
        lastTurnAnswer = appendQualityNotes(answerText, turnCalls);
        addMsg("assistant", lastTurnAnswer);
        if (!isEvalMode()) renderFollowups(turnCalls);
        logTurn(lastTurnAnswer);
        return;
      }
      if (step >= MAX_STEPS) {
        addMsg("note", "ステップ上限 (" + MAX_STEPS + ") に達したため打ち切りました。");
        return;
      }
      /* 提案マージ: モデルが呼び出し候補と同じツールを選んだ場合、
       * 欠けている提案キーを補完する (モデルの指定が優先)。
       * 「提案の group_by だけコピーして metrics が脱落」する部分コピーが
       * 実測で発生したため。補正は 表示で可視化される。 */
      var actArgs = act.arguments || {};
      if (suggestion && act.tool === suggestion.tool && turnCalls.length === 0) {
        actArgs = Object.assign({}, suggestion.args, actArgs);
        /* 文脈継続時: モデルが新しい条件だけを書いても直前の絞り込みを
         * 失わないよう、where は1段深くマージする (モデルの指定が優先) */
        if (contWhere && actArgs.where && suggestion.args.where) {
          actArgs.where = Object.assign({}, suggestion.args.where, actArgs.where);
        }
      }
      var cleanedArgs = cleanArguments(act.tool, actArgs);
      /* 同一呼び出しの反復ガード: 直前と同じツール+引数は実行せず、
       * 手元の結果から回答するよう差し戻す (無引数 query の連発が実測で発生) */
      var prev = turnCalls[turnCalls.length - 1];
      if (prev && prev.tool === act.tool &&
          JSON.stringify(prev.args) === JSON.stringify(cleanedArgs)) {
        if (!repeatNudged && step < MAX_STEPS) {
          repeatNudged = true;
          addMsg("note", "同じ呼び出しの繰り返しのため、結果からの回答を促しました");
          prompt = "直前と同じツール呼び出しが繰り返されています。新しい呼び出しはせず、" +
            'これまでの結果を使って {"action":"answer","answer":"..."} を返す。';
          return next();
        }
        addMsg("note", "同じ呼び出しの繰り返しが続いたため打ち切りました");
        return;
      }
      var callRec = { tool: act.tool, args: cleanedArgs };
      turnCalls.push(callRec);
      return runToolWithCard(act.tool, cleanedArgs, { orig: act.arguments || {} }).then(function(result) {
        var data = (result && result.structuredContent) || {};
        callRec.data = data;  // フォローアップ提案の導出に使う
        /* 単軸集計のグループ数を記憶し、クロス軸提案の適性判断に使う */
        if (act.tool === "summarize_records" && cleanedArgs.group_by &&
            cleanedArgs.group_by.length === 1 && !cleanedArgs.where &&
            typeof data.total_group_count === "number") {
          observedGroupCounts[cleanedArgs.group_by[0]] = data.total_group_count;
        }
        /* リフレクション誘導: 失敗・0件は「見直して再試行」を明示的に促す。
         * 1回目の呼び出しが外れても2回目で立て直せるようにする (汎用ロジック)。 */
        var emptyResult = !result.isError && (
          (Array.isArray(data.rows) && data.rows.length === 0) ||
          data.total === 0 || data.total_groups === 0 ||
          (Array.isArray(data.datasets) && data.datasets.length === 0));
        callRec.ok = !result.isError && !emptyResult;
        var nudge = "";
        if (result && result.isError) {
          var dym = didYouMean(cleanedArgs);
          nudge = "エラーになった。エラー内容を読み、フィールド名や引数を修正して再試行する。" +
            (dym.length > 0 ? " もしかして: " + dym.join("、") : "") + "\n";
          addMsg("note", "エラーのため引数の修正を促しました" +
            (dym.length > 0 ? " (もしかして: " + dym.join("、") + ")" : ""));
        } else if (emptyResult) {
          nudge = "結果は0件だった。フィールド名や値の指定を見直し、別の引数やツールで再試行する。";
          if (data.hint) {
            nudge += " ヒント: " + data.hint;
          }
          nudge += "\n";
          addMsg("note", "0件だったため指定の見直しを促しました");
        }
        /* 教訓メモリ: 失敗を記録し、続く成功呼び出しを followup として紐づける */
        if (lessonsEnabled()) {
          if (result.isError || emptyResult) {
            pendingLesson = { at: Date.now(), tool: act.tool, args: cleanedArgs,
                              outcome: result.isError ? "エラー" : "0件", followup: null };
            recordLesson(pendingLesson);
          } else if (pendingLesson) {
            pendingLesson.followup = { tool: act.tool, args: cleanedArgs };
            recordLesson(pendingLesson);
            pendingLesson = null;
          }
        }
        /* 観測ストア: 成功した呼び出しから品質観測を蓄積する */
        if (!result.isError && !emptyResult) {
          recordObservation(act.tool, cleanedArgs, data);
        }
        var digestStr = digestForModel(act.tool, data);
        var dStep = stepStart("結果の抜粋をモデルへ返送");
        dStep.done("結果の抜粋をモデルへ返送 (" + digestStr.length + " 字)", digestStr);
        prompt = "ツール " + act.tool + " の結果(抜粋): " + digestStr +
          "\n" + nudge + NEXT_INSTR;
        return next();
      });
    }).catch(function(err) {
      if (genStep) genStep.done("エラー", String(err && err.message || err));
      addMsg("error", humanizeError(err));
      logTurn("(エラー) " + (err && err.message || err));
    });
  }

  return next();
}

/* ================= eval モード (?eval) ================= */
/* tests/evals/cases.json のケースを実 Gemini Nano で順次実行し、
 * SLM のツール呼び出しを期待値と照合して採点する。
 * 結果は /api/eval-result 経由で tests/evals/results/latest.json に保存され、
 * Claude Code 等がファイルを読んでプロンプト改善のループを回せる。 */

function isEvalMode() {
  return new URLSearchParams(location.search).has("eval");
}

/* 構成パラメータ (flow / cot 等) を URL クエリから読む */
function cfgParam(name) {
  return new URLSearchParams(location.search).get(name);
}

function evalLimit() {
  var v = parseInt(new URLSearchParams(location.search).get("eval"), 10);
  return isNaN(v) || v <= 0 ? 0 : v;
}

function isWatchMode() {
  return new URLSearchParams(location.search).has("watch");
}

/* 期待値照合: 配列=全要素含む / 文字列=部分一致 / オブジェクト=再帰 / 他=完全一致 */
function argsMatch(expected, actual) {
  if (expected == null) return true;
  if (actual == null) return false;
  return Object.keys(expected).every(function(k) {
    var e = expected[k], a = actual[k];
    if (Array.isArray(e)) {
      return Array.isArray(a) && e.every(function(x) { return a.indexOf(x) >= 0; });
    }
    if (typeof e === "object" && e !== null) {
      return typeof a === "object" && a !== null && argsMatch(e, a);
    }
    if (typeof e === "string") return typeof a === "string" && a.indexOf(e) >= 0;
    return a === e;
  });
}

/* watch モード: ハーネス (ページ or eval ケース) の更新を検知したら
 * 自動でリロードして eval を再実行する。Claude Code 側は
 * tests/evals/results/latest.json の更新を監視すればループが閉じる。 */
var _versionEtag = null;
var _watchTimer = null;

function startWatch() {
  if (_watchTimer) return;
  _watchTimer = setInterval(function() {
    fetch("/api/version").then(function(r) { return r.json(); }).then(function(v) {
      if (_versionEtag && v.etag && v.etag !== _versionEtag) {
        clearInterval(_watchTimer);
        addMsg("note", "ハーネスの更新を検知しました — リロードして eval を再実行します。");
        setTimeout(function() { location.reload(); }, 800);
      }
    }).catch(function() { /* サーバー再起動中などは次回に */ });
  }, 5000);
}

/* set=auto: カタログ (list + inspect の結果) から eval ケースを自動生成する。
 * データセット固有のケース定義が無くても、任意のデータセットで
 * 「集計/クロス/sum/where/order_by/メタ」の基本能力を測定できる。 */
var QUALITY_WORDS = ["記入率", "注記", "欠損", "無回答", "未記入", "空欄"];

function autoCases() {
  var c = catalogInfo[0];
  if (!c) return [];
  var id = c.dataset_id;
  var cases = [];
  c.groupable.slice(0, 3).forEach(function(f) {
    cases.push({ prompt: f + "ごとの件数を集計して", category: "集計-基本",
                 expect: { tool: "summarize_records", args_include: { group_by: [f] } } });
  });
  c.groupable.filter(function(f) { return (c.fillRates[f] != null ? c.fillRates[f] : 1) < 0.2; })
    .slice(0, 2).forEach(function(f) {
      cases.push({ prompt: f + "別の内訳を教えて", category: "集計-品質注記",
                   expect: { tool: "summarize_records",
                             args_include: { group_by: [f] },
                             answer_includes_any: QUALITY_WORDS } });
    });
  if (c.groupable.length >= 2) {
    cases.push({ prompt: c.groupable[0] + "と" + c.groupable[1] + "のクロス集計をして",
                 category: "クロス集計",
                 expect: { tool: "summarize_records",
                           args_include: { group_by: [c.groupable[0], c.groupable[1]] } } });
  }
  cases.push({ prompt: "全部で何件ある?", category: "全体件数",
               expect: { tool: "summarize_records" } });
  var agg = c.aggregatable[0];
  if (agg) {
    cases.push({ prompt: agg + "の合計は?", category: "sum-avg",
                 expect: { tool: "summarize_records",
                           args_include: { metrics: ["sum:" + agg] } } });
    cases.push({ prompt: c.groupable[0] + "ごとの" + agg + "の合計を出して", category: "sum-avg",
                 expect: { tool: "summarize_records",
                           args_include: { group_by: [c.groupable[0]],
                                           metrics: ["sum:" + agg] } } });
    cases.push({ prompt: agg + "が多い順に見せて", category: "order_by",
                 expect: { tool: "query_records",
                           args_include: { order_by: agg } } });
  }
  var wf = Object.keys(c.codeValues)[0];
  if (wf) {
    var wv = c.codeValues[wf];
    var w = {};
    w[wf] = String(wv).replace(/^[\d\-]+\s*/, "");  // ラベル部分での部分一致を期待
    cases.push({ prompt: wf + "が「" + wv + "」のレコードを見せて", category: "whereフィルタ",
                 expect: { tool: "query_records", args_include: { where: w } } });
  }
  cases.push({ prompt: "このデータにはどんなフィールドがある?", category: "メタ",
               expect: { tool: "inspect_dataset" } });
  return cases;
}

function runEval() {
  var pVersion = fetch("/api/version").then(function(r) { return r.json(); })
    .then(function(v) { _versionEtag = v.etag; })
    .catch(function() {});
  pVersion.then(function() {
    var setName = new URLSearchParams(location.search).get("set");
    if (setName === "auto") {
      addMsg("note", "eval ケースをカタログから自動生成します (set=auto)");
      /* set=auto はカタログ (inspect 結果) からケースを生成するため、
       * 選択 UI を待たず先頭のデータセットを自動選択して inspect する。
       * (通常セットは agentTurn 内の遅延 inspect で足りるが、auto は
       * ケース生成自体がカタログを必要とする) */
      var ready = Promise.resolve();
      if (catalogInfo.length === 0 && datasetList.length > 0) {
        addMsg("note", "eval モード: データセット「" + datasetList[0].dataset_id +
          "」を自動選択して構造を取得します");
        ready = inspectAndStartSession(datasetList[0]);
      }
      return ready.then(function() {
        return { ok: true, json: function() { return Promise.resolve({ cases: autoCases() }); } };
      });
    }
    return fetch("/api/eval-cases" + (setName ? "?set=" + encodeURIComponent(setName) : ""));
  }).then(function(r) {
    return r.json().then(function(data) {
      if (!r.ok) throw new Error(data.error || ("HTTP " + r.status));
      return data.cases || [];
    });
  }).then(function(cases) {
    if (cases.length === 0) throw new Error("ケースが空です");
    // 実行中のスタックからも復旧できるよう、watch は eval 開始時から監視する
    // (ハーネスが更新されたらランを打ち切ってリロード → 新版で再実行)
    if (isWatchMode()) startWatch();
    var limit = evalLimit();
    if (limit && limit < cases.length) {
      addMsg("note", "eval モード: 先頭 " + limit + " / " + cases.length + " ケースを実行します。");
      cases = cases.slice(0, limit);
    } else {
      addMsg("note", "eval モード: " + cases.length + " ケースを実行します。");
    }
    setBusy(true);

    return evalCases(cases, null).then(function(summary) {
      window.__EVAL_RESULT__ = summary;
      setBusy(false);
      addMsg("note", "eval 完了: " + summary.passed + "/" + summary.total + " PASS" +
        " (初回一致 " + summary.first_try_passed + ")");
      return postEvalResult(summary);
    });
  }).catch(function(err) {
    setBusy(false);
    addMsg("error", "eval を実行できません: " + (err && err.message || err));
    if (isWatchMode()) startWatch();
  });
}

function postEvalResult(payload) {
  return fetch("/api/eval-result", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  }).then(function() {
    addMsg("note", "結果を tests/evals/results/latest.json に保存しました。");
  }).catch(function() {
    addMsg("note", "(結果を保存できませんでしたが、window.__EVAL_RESULT__ で参照できます)");
  }).then(function() {
    if (isWatchMode()) {
      addMsg("note", "watch モード: ハーネスの更新を監視中… (更新されると自動で再実行)");
      startWatch();
    }
  });
}

/* ケース集を1周実行してサマリーを返す (保存や watch は呼び出し側の責務) */
function evalCases(cases, label) {
    var results = [];
    var chain = Promise.resolve();
    cases.forEach(function(cs, i) {
      chain = chain.then(function() {
        addMsg("user", "[eval " + (label ? label + " " : "") +
          (i + 1) + "/" + cases.length + "] " + cs.prompt);
        var CASE_TIMEOUT_MS = 240000;
        var attempt = 0;
        // clone でケース間の履歴持ち越しを防ぐ (再 create より高速)
        function runCase() {
          attempt++;
          var mark = toolCallLog.length;
          return freshSession().then(function() {
            // ケース単位の上限。超えたら FAIL 記録して次のケースへ進む
            return Promise.race([
              agentTurn(cs.prompt).then(function() { return false; }),
              new Promise(function(resolve) {
                setTimeout(function() { resolve(true); }, CASE_TIMEOUT_MS);
              }),
            ]);
          }).then(function(t) {
            var calls = toolCallLog.slice(mark);
            var answer = lastTurnAnswer || "";
            /* まれにモデルが空応答で終わる (呼び出しも回答も無い)。
             * 単発の揺らぎなので1回だけケースを再試行する */
            if (!t && attempt < 2 && calls.length === 0 && answer === "") {
              addMsg("note", "空応答のためケースを再試行します");
              return runCase();
            }
            return { timedOut: t, calls: calls, answer: answer };
          });
        }
        return runCase().then(function(out) {
          var timedOut = out.timedOut;
          if (timedOut) {
            addMsg("error", "[eval] ケースがタイムアウトしました (" +
              Math.round(CASE_TIMEOUT_MS / 1000) + "s) — 次へ進みます");
          }
          var calls = out.calls;
          var answer = out.answer;
          var exp = cs.expect || {};
          function matchCall(c) {
            var toolOk = !exp.tool ||
              (Array.isArray(exp.tool) ? exp.tool.indexOf(c.name) >= 0 : c.name === exp.tool);
            if (!toolOk) return false;
            /* args_any: 複数の妥当解を許容 (q 検索でも where 部分一致でも正解、等) */
            if (Array.isArray(exp.args_any)) {
              return exp.args_any.some(function(a) { return argsMatch(a, c.arguments); });
            }
            return argsMatch(exp.args_include, c.arguments);
          }
          var callOk = calls.some(matchCall);
          /* answer_includes_any: 回答文の品質条件 (低記入率フィールド使用時の
           * 注記など)。いずれかの語を含めば OK。 */
          var answerOk = !exp.answer_includes_any ||
            exp.answer_includes_any.some(function(s) { return answer.indexOf(s) >= 0; });
          var pass = callOk && answerOk;
          var firstTry = calls.length > 0 && matchCall(calls[0]) && answerOk;
          var rec = { prompt: cs.prompt, category: cs.category || "その他",
                      expect: exp, calls: calls, answer: answer,
                      pass: pass, first_try: firstTry, stats: lastTurnStats,
                      schema_tier: _schemaTier,
                      context_usage: sessionUsageRatio(session) };
          if (timedOut) rec.timeout = true;
          results.push(rec);
          addMsg(pass ? "note" : "error",
            "[eval] " + (pass ? "PASS" : "FAIL") + " — " + cs.prompt);
        });
      });
    });
    return chain.then(function() {
      var passed = results.filter(function(r) { return r.pass; }).length;
      var firstTryPassed = results.filter(function(r) { return r.first_try; }).length;
      var stepsSum = 0;
      results.forEach(function(r) { stepsSum += (r.stats && r.stats.steps) || 0; });
      /* 類型別の集計 — どの能力が退行したかを critic が特定できるようにする */
      var cats = {};
      results.forEach(function(r) {
        var cat = r.category || "その他";
        if (!cats[cat]) cats[cat] = { total: 0, passed: 0, first_try: 0 };
        cats[cat].total++;
        if (r.pass) cats[cat].passed++;
        if (r.first_try) cats[cat].first_try++;
      });
      return {
        total: results.length,
        passed: passed,
        accuracy: results.length ? passed / results.length : 0,
        first_try_passed: firstTryPassed,
        avg_steps: results.length ? Math.round(stepsSum / results.length * 100) / 100 : 0,
        categories: cats,
        harness_version: _versionEtag,
        cases: results,
      };
    });
}

/* ================= UI 配線 ================= */

/* 例文チップとプレースホルダは catalog (実フィールド名) から生成する */
/* ── フォローアップ提案 ──
 * 直前のツール結果と inspect 由来のカタログ (groupable/aggregatable/記入率) から
 * 「次に聞くと良さそうな質問」を導出する。データセット固有の知識は使わない。 */
/* 内訳・クロス軸に適した次元フィールド。role が分かる場合は dim のみ
 * (手続名のような attr はほぼ一意でクロス集計が無意味になる実測があった) */
function dimCandidates(c) {
  return (c.groupable || []).filter(function(f) {
    var role = c.roles && c.roles[f];
    return !role || role === "dim";
  });
}

function followupSuggestions(calls) {
  var c = catalogInfo[0];
  if (!c) return [];
  var last = null;
  for (var i = (calls || []).length - 1; i >= 0; i--) {
    if (calls[i].ok !== false && calls[i].tool !== "list_datasets") { last = calls[i]; break; }
  }
  if (!last) return [];
  var fr = function(f) { return c.fillRates && c.fillRates[f] != null ? c.fillRates[f] : 1; };
  /* 記入率の高い順の次元・数値フィールド (疎なフィールドは提案しない) */
  var dims = dimCandidates(c).filter(function(f) { return fr(f) >= 0.5; })
    .sort(function(a, b) { return fr(b) - fr(a); });
  var measures = (c.aggregatable || []).filter(function(f) { return fr(f) >= 0.4; });
  var qs = [];
  var gb = (last.args && last.args.group_by) || [];
  var data = last.data || {};

  if (last.tool === "summarize_records" && gb.length > 0) {
    /* 最大グループへのドリルダウン (結果の先頭行 = 件数最大) */
    var topVal = null;
    if (Array.isArray(data.columns) && Array.isArray(data.rows) && data.rows.length > 0) {
      var gi = data.columns.indexOf(gb[0]);
      if (gi >= 0) topVal = data.rows[0][gi];
    }
    if (topVal != null && String(topVal) !== "" && String(topVal).length <= 30) {
      qs.push(gb[0] + "が「" + String(topVal) + "」のものを一覧して");
    }
    /* クロス軸はカーディナリティが低いと確信できるフィールドのみ提案する:
     * codelist 有り (列挙型で確定) か、単軸集計の実測グループ数が 50 以下 */
    var second = dims.filter(function(f) {
      if (gb.indexOf(f) >= 0) return false;
      if (c.codelists && c.codelists[f]) return true;
      return observedGroupCounts[f] != null && observedGroupCounts[f] <= 50;
    })[0];
    if (second) qs.push(gb[0] + "と" + second + "のクロス集計をして");
    if (measures[0]) qs.push(gb[0] + "ごとの" + measures[0] + "の合計は?");
  } else if (last.tool === "query_records") {
    var whereFields = Object.keys((last.args && last.args.where) || {});
    var dim = dims.filter(function(f) { return whereFields.indexOf(f) < 0; })[0];
    if (dim) qs.push("この条件で" + dim + "ごとに集計して");
    if (whereFields.length === 0 && dims[0]) qs.push(dims[0] + "ごとの件数を集計して");
    if (measures[0]) qs.push(measures[0] + "が多い順に一覧して");
  } else if (last.tool === "inspect_dataset") {
    if (dims[0]) qs.push(dims[0] + "ごとの件数を集計して");
    if (dims[1]) qs.push(dims[1] + "の内訳は?");
    if (measures[0]) qs.push(measures[0] + "の合計は?");
  }
  return qs.slice(0, 3);
}

/* 「次の一手」チップを消し、隠していた例チップの表示を戻す (セッション切替・復元時) */
function clearFollowups() {
  var container = document.getElementById("followups-container");
  if (container) container.innerHTML = "";
  var examplesEl = document.getElementById("examples");
  if (examplesEl) examplesEl.style.display = "";
}

function renderFollowups(calls) {
  var qs = followupSuggestions(calls);
  if (qs.length === 0) return;
  var container = document.getElementById("followups-container");
  if (!container) return;

  // 次の一手が表示されるときは、例チップは非表示にする
  var examplesEl = document.getElementById("examples");
  if (examplesEl) examplesEl.style.display = "none";

  container.innerHTML = "";
  var wrap = document.createElement("div");
  wrap.className = "followups";
  var label = document.createElement("span");
  label.className = "fu-label";
  label.textContent = "次の一手:";
  wrap.appendChild(label);
  qs.forEach(function(text) {
    var btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = text;
    btn.addEventListener("click", function() {
      inputEl.value = text;
      inputEl.focus();
    });
    wrap.appendChild(btn);
  });
  container.appendChild(wrap);
  syncChipDisabled();  // 生成直後に現在の送信可否を反映する
}

function exampleQuestions() {
  var qs = [];
  var c = catalogInfo[0];
  /* 遅延 inspect モードの初期状態: データセットの一覧・タイトルから例を作る */
  if (!c && datasetList.length > 1) {
    qs.push("どんなデータセットがある?");
    datasetList.slice(0, 2).forEach(function(d) {
      qs.push(String(d.title || d.dataset_id).slice(0, 14) + "のデータは?");
    });
    return qs.slice(0, 3);
  }
  var dims = c ? dimCandidates(c) : [];
  if (dims[0]) qs.push(dims[0] + "ごとの件数を集計して");
  /* 「内訳」の例は codelist を持つ列挙型の次元から選ぶ
   * (法令名のような高カーディナリティ次元は例として不適) */
  var enumDim = dims.filter(function(f) {
    return f !== dims[0] && c.codelists && c.codelists[f];
  })[0];
  if (enumDim) qs.push(enumDim + "の内訳は?");
  var m = c && (c.aggregatable || [])[0];
  if (m) qs.push(m + "が多い順に一覧して");
  if (qs.length < 3) qs.push("全部で何件ある?");
  return qs.slice(0, 3);
}

function buildExampleChips() {
  var examplesEl = document.getElementById("examples");
  examplesEl.innerHTML = "";
  exampleQuestions().forEach(function(text) {
    var btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = text;
    btn.addEventListener("click", function() {
      inputEl.value = text;
      inputEl.focus();
    });
    examplesEl.appendChild(btn);
  });
  syncChipDisabled();  // 生成直後に現在の送信可否を反映する
}

function defaultPlaceholder() {
  var qs = exampleQuestions();
  return qs.length ? "例: " + qs[0] : "データについて質問してください";
}

function setBusy(b) {
  busy = b;
  sendBtn.disabled = b || !lmReady;
  inputEl.disabled = b;
}

/* 送信ボタンの無効状態を例・「次の一手」チップに同期する (視覚一貫性)。
 * sendBtn.disabled は busy 以外 (モデルの準備状態等) からも変わるため、
 * 変更箇所を個別に追わず、属性の変化を監視して一括反映する */
function syncChipDisabled() {
  var dis = sendBtn.disabled;
  document.querySelectorAll("#examples button, .followups button").forEach(function(b) {
    b.disabled = dis;
  });
}
new MutationObserver(syncChipDisabled)
  .observe(sendBtn, { attributes: true, attributeFilter: ["disabled"] });

document.getElementById("new-session").addEventListener("click", function() {
  if (busy) return;
  startNewSession(true);
});

/* ページ版の鮮度チェック: タブへフォーカスが戻るたびに /api/version を確認し、
 * ハーネスが更新されていたら再読み込みバナーを出す (古い版を触り続ける事故防止) */
var _loadEtag = null;
fetch("/api/version").then(function(r) { return r.json(); })
  .then(function(v) { _loadEtag = v.etag; }).catch(function() {});
window.addEventListener("focus", function() {

  fetch("/api/version").then(function(r) { return r.json(); }).then(function(v) {
    if (v.etag && v.etag !== _loadEtag) showUpdateBanner();
  }).catch(function() {});
});

  if (document.getElementById("update-banner")) return;
  var bar = document.createElement("div");

  btn.textContent = "再読み込み";
  btn.className = "primary";
  btn.addEventListener("click", function() { location.reload(); });

  bar.appendChild(btn);

/* ================= 初期化 ================= */

function buildSystemPrompt(desc) {
  /* Gemini Nano には ## 区切りによるセクション分けが特に有効
   * (ML Kit "Prompt design for Gemini Nano" の推奨に従う) */
  var lines = [
    "あなたはデータ分析アシスタント。提供されたデータセットをツールで検索・集計し、日本語で答える。",
    "",
    "## 出力形式",
    "応答は必ず JSON オブジェクト1個のみ。説明文・コードフェンスは禁止。",
    'ツールを呼ぶ: {"action":"tool_call","tool":"<name>","arguments":{...}}',
    '最終回答: {"action":"answer","answer":"<回答>"}',
    "",
    "## ツール (* は必須引数)",
  ];
  (desc.tools || []).forEach(function(t) {
    var props = (t.parameters && t.parameters.properties) || {};
    var req = (t.parameters && t.parameters.required) || [];
    var ps = Object.keys(props).map(function(k) {
      return k + (req.indexOf(k) >= 0 ? "*" : "") + ":" + (props[k].type || "");
    }).join(", ");
    lines.push("- " + t.name + "(" + ps + ") — " + t.description);
  });
  lines.push("");
  lines.push("## ルール");
  lines.push('where 構文: 文字列=部分一致, 配列=IN, {"$gte":n}/{"$lte":n}=範囲。');
  var aggExample = catalogInfo[0] && catalogInfo[0].aggregatable[0];
  lines.push('metrics 例: ["count"]' +
    (aggExample ? ', ["sum:' + aggExample + '"]' : "") +
    "。group_by はフィールド名の JSON 配列。");
  lines.push("- データセットの構造は「## データセット」に記載済み。通常は summarize_records (集計) か query_records (検索) を 1 回呼べば答えられる。");
  lines.push("- 対象のデータセットが不明なとき・複数候補から選ぶときは、まず list_datasets で探し、必要に応じて inspect_dataset で構造と品質を確認してから呼ぶ。");
  lines.push("- 「◯◯ごと」「◯◯別」「内訳」「分布」「割合」はすべて集計 = summarize_records + group_by。group_by に必ずそのフィールド名を入れる (空だと全体合計のみ)。");
  lines.push("- 「AとBで集計」「AごとにBの内訳」は group_by に A と B の両方を入れる。");
  lines.push("- metrics に入れられるのは count / sum:数値フィールド / avg:数値フィールド のみ。フィールド名単体を metrics に入れるのは禁止。having は count 等の集計値の絞り込み専用。");
  lines.push("- count はレコードの数。「◯◯件数の合計」のように数値フィールドの総和を聞かれたら metrics に [\"sum:◯◯件数\"] を使う。");
  lines.push("- 「AごとのBの合計/平均」は group_by:[\"A\"] と metrics:[\"sum:B\"] の両方を1回の呼び出しに指定する。");
  lines.push("- q はレコードの値を探すキーワード用。フィールド名を q や search_fields に入れるのは禁止。");
  lines.push("- group_by / where のフィールド名は「## データセット」の一覧の名前をそのまま使う。記入率が低いフィールドを使ったときは回答に注記する。");
  lines.push("- 質問に「参考: 呼び出し候補」が付いている場合は原則それに従って呼び出す。質問に合わないと判断した部分だけ修正してよい。");
  lines.push("- 数値は必ずツール結果の値をそのまま引用する。結果に無い情報を述べるのは禁止。");
  lines.push("- データについての質問には必ずツールを呼んでから答える。会話例に出てくる数値を実データとして使うのは禁止。");
  lines.push("- ツールの使い方や手順を説明する回答は禁止。説明する代わりに、実際に tool_call の JSON を返して実行する。");
  if (lessonsEnabled()) {
    var ll = lessonLines(5);
    if (ll.length > 0) {
      lines.push("");
      lines.push("## 過去の教訓 (この環境での実績)");
      ll.forEach(function(s) { lines.push("- " + s); });
    }
  }
  lines.push("");
  lines.push("## データセット");
  catalogInfo.forEach(function(c) {
    lines.push("");
    var head = 'データセット "' + c.dataset_id + '"';
    if (c.title) head += " (" + c.title + (c.record_count ? "、" + c.record_count + "件" : "") + ")";
    else if (c.record_count) head += " (" + c.record_count + "件)";
    lines.push(head + " のフィールド:");
    if (c.quality) {
      var q = c.quality;
      lines.push("フィールド記入率の概況: ほぼ完全 " + (q.fully_populated || 0) +
        " / 高 " + (q.mostly_populated || 0) + " / 疎 " + (q.sparse || 0) + " 項目");
    }
    c.fields.forEach(function(f) { lines.push(f); });
  });
  /* 未 inspect のデータセットは id + タイトルの一覧だけ載せる (多データセット時)。
   * 構造が必要になれば inspect_dataset で確認できることを SLM に示す */
  var inspected = {};
  catalogInfo.forEach(function(c) { inspected[c.dataset_id] = true; });
  var others = datasetList.filter(function(d) { return !inspected[d.dataset_id]; });
  if (others.length > 0) {
    lines.push("");
    lines.push("他のデータセット (構造が必要なら inspect_dataset で確認):");
    others.slice(0, 30).forEach(function(d) {
      lines.push("- " + d.dataset_id + ": " + String(d.title || "").slice(0, 40));
    });
    if (others.length > 30) {
      lines.push("… 他 " + (others.length - 30) + " 件 (list_datasets で確認)");
    }
  } else if (catalogInfo.length === 0 && datasetIds.length > 0) {
    lines.push("利用可能な dataset_id: " + datasetIds.join(", "));
  }
  return lines.join("\n");
}

/* inspect_dataset の結果から SLM 向けのフィールド表 (品質タグ付き) を作る */
function extractCatalogEntry(info, inspectData) {
  var entry = {
    dataset_id: info.dataset_id,
    title: info.title,
    record_count: info.record_count,
    fields: [], groupable: [], aggregatable: [],
  };
  if (!inspectData || !Array.isArray(inspectData.columns) || !Array.isArray(inspectData.rows)) {
    return entry;
  }
  var idx = {};
  inspectData.columns.forEach(function(c, i) { idx[c] = i; });
  function v(row, key) {
    var i = idx[key];
    return i == null ? null : row[i];  // 末尾 null は行から省略されている
  }
  entry.allFields = [];
  entry.fillRates = {};
  entry.codeValues = {};
  entry.codelists = {};
  entry.roles = {};
  entry.descs = {};
  inspectData.rows.forEach(function(row) {
    var id = v(row, "id");
    if (!id) return;
    entry.allFields.push(id);
    var tags = [];
    var role = v(row, "role");
    if (role) { tags.push(role); entry.roles[id] = role; }
    /* desc はハーネス側の照合語彙としてのみ保持する (フィールドヒント用)。
     * dataset.yaml 由来の自由記述のためプロンプトには一切出さない (信頼境界) */
    var dsc = v(row, "desc");
    if (typeof dsc === "string" && dsc) entry.descs[id] = dsc;
    if (v(row, "groupable")) { tags.push("group_by可"); entry.groupable.push(id); }
    if (v(row, "aggregatable")) { tags.push("sum/avg可"); entry.aggregatable.push(id); }
    if (v(row, "multi_value")) tags.push("複数値");
    var fr = v(row, "fill_rate");
    if (typeof fr === "number") entry.fillRates[id] = fr;
    if (typeof fr === "number" && fr < 0.9) tags.push("記入率" + Math.round(fr * 100) + "%");
    var line = id + " [" + tags.join(",") + "]";
    /* codelist (コード値) は where の値指定と結果解釈の生命線なので必ず見せる */
    var cl = v(row, "codelist");
    if (Array.isArray(cl) && cl.length > 0) {
      entry.codeValues[id] = cl.length > 1 ? cl[1] : cl[0];  // few-shot の where 例に使う
      entry.codelists[id] = cl.slice(0, 20);                 // 質問との値マッチングに使う
      var vals = cl.slice(0, 6).join("|");
      if (vals.length > 80) vals = vals.slice(0, 80) + "…";
      else if (cl.length > 6) vals += "|…";
      line += " 値:[" + vals + "]";
    }
    entry.fields.push(line);
  });
  if (inspectData.quality_summary) entry.quality = inspectData.quality_summary;
  return entry;
}

/* list_datasets UI を表示してユーザーがデータセットを選択するまで待つ。
 * ユーザーが選択したら inspectAndStartSession() がコールされる (list_datasets.html の postMessage) */
function runDiscovery() {
  var box = document.createElement("details");
  box.className = "discovery";
  var boxSummary = document.createElement("summary");
  boxSummary.innerHTML = ICONS.search + "<span></span>";
  var boxLabel = boxSummary.querySelector("span");
  boxLabel.textContent = "データセットを選択してください…";
  box.appendChild(boxSummary);
  chatEl.appendChild(box);
  box.open = true;

  return runToolWithCard("list_datasets", {}, { container: box }).then(function(result) {
    var data = result.structuredContent || {};
    datasetList = (data.datasets || []).filter(function(d) { return d.dataset_id; });
    return datasetList;
  }).catch(function() { return []; }).then(function(datasets) {
    if (datasets.length === 0) {
      addMsg("error", "利用可能なデータセットがありません");
    }
  });
}

/* list_datasets UI からのデータセット選択で呼ばれる。
 * inspect_dataset を実行して、その結果でセッション初期化 → 会話開始 */
function inspectAndStartSession(dataset) {
  var key = "apcli-preview:catalog4:" + dataset.dataset_id;
  busy = true;
  return apiCall("inspect_dataset", { dataset_id: dataset.dataset_id })
    .then(function(result) {
      var entry = extractCatalogEntry(dataset, result.structuredContent || null);
      lsSet(key, { at: Date.now(), entry: entry });
      catalogInfo = [entry];
      finishDiscovery([entry], [dataset]);
    })
    .catch(function(err) {
      var cached = lsGet(key);
      if (cached && cached.entry) {
        catalogInfo = [cached.entry];
        finishDiscovery([cached.entry], [dataset]);
      } else {
        addMsg("error", "データセット「" + dataset.dataset_id + "」の情報を取得できませんでした");
      }
    })
    .then(function() { busy = false; });
}

function initWithoutInspect(datasets) {
  return Promise.resolve([]);
}

function finishDiscovery(entries, datasets) {
  catalogInfo = entries;
  datasetIds = datasets.map(function(d) { return d.dataset_id; });
  if (datasetIds.length > 0) {
    ARGS_SCHEMA.properties.dataset_id.enum = datasetIds;
  }
  systemPrompt = buildSystemPrompt(describeData || {});
  buildExampleChips();
  inputEl.placeholder = defaultPlaceholder();
  if (lmReady) resetSession(null);
}

/* ================= LLM 応答からツール呼び出しを抽出 ================= */
/**
 * LLM 応答から JSON フォーマットのツール呼び出しを抽出
 * 想定フォーマット (systemPrompt 指定):
 *   {"action":"tool_call","tool":"<name>","arguments":{...}}
 * または従来形式:
 *   {"tool": "tool_name", "args": {...}}
 */
function extractToolCallFromResponse(text) {
  if (!text || typeof text !== "string") return null;

  // JSON ブロック（```json ... ```）から抽出
  var jsonMatch = text.match(/```json\n?([\s\S]*?)\n?```/);
  if (jsonMatch) {
    try {
      var parsed = JSON.parse(jsonMatch[1]);
      if (parsed.action === "tool_call" && parsed.tool && TOOL_TEMPLATES[parsed.tool]) {
        return { tool: parsed.tool, args: parsed.arguments || {} };
      }
    } catch (e) { /* JSON parse error */ }
  }

  // インライン JSON から抽出（{...}）
  var jsonStart = text.indexOf("{");
  if (jsonStart >= 0) {
    var jsonStr = text.substring(jsonStart);
    try {
      var parsed = JSON.parse(jsonStr);
      // systemPrompt フォーマット
      if (parsed.action === "tool_call" && parsed.tool && TOOL_TEMPLATES[parsed.tool]) {
        return { tool: parsed.tool, args: parsed.arguments || {} };
      }
      // 従来形式
      if (parsed.tool && TOOL_TEMPLATES[parsed.tool]) {
        return { tool: parsed.tool, args: parsed.args || {} };
      }
    } catch (e) { /* JSON parse error */ }
  }

  return null;
}


function init() {
  fetch("/api/describe").then(function(r) { return r.json(); }).then(function(desc) {
    describeData = desc;
    (describeData.tools || []).forEach(function(t) {
      var set = {};
      Object.keys((t.parameters && t.parameters.properties) || {}).forEach(function(k) {
        set[k] = true;
      });
      TOOL_PARAMS[t.name] = set;
    });
    return startNewSession(true);  // セッション開始 = 探索フローを実行
  }).then(function() {
    LM = lmNamespace();
    if (!LM) {
      setStatus("内蔵 AI: 利用不可", "err");
      showSetupPanel();
      return;
    }
    return lmAvailability(LM).then(function(avail) {
      if (avail === "unavailable") {
        setStatus("内蔵 AI: 利用不可", "err");
        showSetupPanel();
        return;
      }
      if (avail === "available") {
        lmReady = true;
        sendBtn.disabled = false;
        setStatus("内蔵 AI: 利用可能 (Gemini Nano)", "ok");

        // PreviewSession を初期化
        session = new PreviewSession();
        return session.init().then(function() {
          if (isEvalMode()) { runEval(); return; }  // 自動実行 (watch ループ用)
          inputEl.focus();
        });
      }
      // downloadable / downloading — 準備完了までチャットは開放しない。
      // ダウンロードはバナーのボタン (ユーザー操作) からのみ開始する。
      setStatus(avail === "downloading" ? "内蔵 AI: ダウンロード中" : "内蔵 AI: 要ダウンロード", "warn");
      inputEl.placeholder = "モデルのダウンロード後に利用できます (上のバナーから開始)";
      showDownloadBanner(avail);
    });
  }).catch(function(err) {
    setStatus("初期化できませんでした", "err");
    addMsg("error", "初期化できませんでした: " + (err && err.message || err));
  });
}

init();
