name: Test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject.toml の requires-python = ">=3.10" に対応する全バージョン
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # dev 依存は PEP 735 の [dependency-groups] にあるため extras (.[dev]) ではなく --group で入れる
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group dev

      - name: Run tests
        run: pytest -q

  # MCP 仕様 2026-07-28 (FastMCP 4 / mcp 2.x) での回帰検知。
  # FastMCP 4 はプレリリースのため失敗しても全体は落とさない。
  pytest-spec-2026:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies (FastMCP 4 pre-release)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[excel]" --group dev
          pip install --pre "fastmcp>=4.0.0b1"

      - name: Show negotiated protocol version
        run: python -c "import mcp.types as t; print('MCP protocol:', t.LATEST_PROTOCOL_VERSION)"

      - name: Run tests
        run: pytest -q
