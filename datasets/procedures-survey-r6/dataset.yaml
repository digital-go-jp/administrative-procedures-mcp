schema_version: "1"
title: 行政手続等の棚卸調査結果
publisher: デジタル庁 (Digital Agency of Japan)
id_field: 手続ID
source:
  url: https://www.digital.go.jp/resources/procedures-survey-results
  # 配布ページ上のファイルを名前パターンで探す。直リンクを記録しないのは、
  # 改訂のたびに日付とパス中のハッシュが変わりリンクが腐るため。
  asset_pattern: _procedures-survey-results_outline_02\.(xlsx|csv)$
  csv_filename: 20250729_procedures-survey-results_outline_02.xlsx
  csv_header_rows: 2
published_at: '2025-07-24'
data_file: data.parquet
fields:
- role: id
  desc: 手続を一意に識別するID。
  csv_col_index: 0
  name: 手続ID
- role: dim
  codelist: auto
  desc: 手続が規定されている法令（の条文）を所管する府省庁。
  csv_col_index: 1
  name: 所管府省庁
- role: attr
  desc: 手続の名称。
  csv_col_index: 2
  name: 手続名
- role: dim
  codelist: auto
  desc: 手続の根拠法令の正式名称。
  csv_col_index: 3
  name: 法令名
- role: dim
  codelist: auto
  desc: 手続の根拠法令の法令番号。
  csv_col_index: 4
  name: 法令番号
- role: attr
  desc: 手続が規定されている条、項、号の番号。複数ある場合は主となる条項号番号のみ。
  csv_col_index: 5
  name: 根拠条項号
- role: dim
  codelist:
  - 1 申請等: 申請、届出その他の法令の規定に基づき行政機関等に対して行われる通知
  - 2-1 申請等に基づく処分通知等: 上記1の申請等に基づき、処分の通知その他の法令の規定により行政機関等が行う通知
  - 2-2 申請等に基づかない処分通知等: 上記1の申請等に基づかない処分の通知その他の法令の規定により行政機関等が行う通知
  - 2-3 交付等（民間手続）: 処分の通知その他の法令の規定に基づき民間事業者等が行う交付、提出、提供
  - 3 縦覧等: 書面等又は電磁的記録を、縦覧若しくは閲覧に供すること又は謄写させること
  - 4 作成・保存等: 書面等若しくは電磁的記録を作成、記載、記録、調製又は保存すること
  desc: 手続の類型。申請等、処分通知等（申請に基づく/基づかない）、交付等（民間手続）、縦覧等、作成・保存等に分類。
  csv_col_index: 6
  name: 手続類型
- role: dim
  codelist:
  - 1 国: 国の行政機関を指します。
  - 2 独立行政法人等: 独立行政法人、特殊法人、認可法人、指定法人等を指します。ただし、地方公共団体の機関は「地方等」に含みます。
  - 3 地方等: 地方公共団体とその機関（地方公共団体の独立行政法人等を含み、議会を除く。）を指します。
  - 4-1 国又は独立行政法人等: 「1 国」「2 独立行政法人等」の双方が主体となる手続である場合に選択します。
  - 4-2 独立行政法人等又は地方等: 「2 独立行政法人等」「3 地方等」の双方が主体となる手続である場合に選択します。
  - 4-3 国又は地方等: 「1 国」「3 地方等」の双方が主体となる手続である場合に選択します。
  - 4-4 国、独立行政法人等又は地方等: 「1 国」「2 独立行政法人等」「3 地方等」のいずれもが主体となる手続である場合に選択します。
  - 5 国民等: 事業を行う立場以外の個人を指します。個人事業主は含みません。日本国籍を有しない個人を含みます。
  - 6 民間事業者等: 事業を行う立場の者を指します。個人事業主を含みます。
  - 7 国民等、民間事業者等: 「5 国民等」「6 民間事業者等」の双方が主体となる手続である場合に選択します。
  desc: 手続を行う主体。国、独立行政法人等、地方等、国民等、民間事業者等、及びその組合せから選択。
  csv_col_index: 7
  name: 手続主体
- role: dim
  codelist:
  - 1 国: 国の行政機関を指します。
  - 2 独立行政法人等: 独立行政法人、特殊法人、認可法人、指定法人等を指します。ただし、地方公共団体の機関は「地方等」に含みます。
  - 3 地方等: 地方公共団体とその機関（地方公共団体の独立行政法人等を含み、議会を除く。）を指します。
  - 4-1 国又は独立行政法人等: 「1 国」「2 独立行政法人等」の双方が受け手となる手続である場合に選択します。
  - 4-2 独立行政法人等又は地方等: 「2 独立行政法人等」「3 地方等」の双方が受け手となる手続である場合に選択します。
  - 4-3 国又は地方等: 「1 国」「3 地方等」の双方が受け手となる手続である場合に選択します。
  - 4-4 国、独立行政法人等又は地方等: 「1 国」「2 独立行政法人等」「3 地方等」のいずれもが受け手となる手続である場合に選択します。
  - 5 国民等: 事業を行う立場以外の個人を指します。個人事業主は含みません。
  - 6 民間事業者等: 事業を行う立場の者を指します。個人事業主を含みます。
  - 7 国民等、民間事業者等: 「5 国民等」「6 民間事業者等」の双方が受け手となる手続である場合に選択します。
  desc: 最終的に手続を受ける者。手続類型が「1 申請等」「2-1〜2-3」の手続が対象。国、独立行政法人等、地方等、国民等、民間事業者等、及びその組合せから選択。
  csv_col_index: 8
  name: 手続の受け手
- role: attr
  codelist:
  - 1 国: 国の行政機関を指します。
  - 2 独立行政法人等: 独立行政法人、特殊法人、認可法人、指定法人等を指します。
  - 3 地方等: 地方公共団体とその機関を指します。
  - 4-1 国又は独立行政法人等: 「1 国」「2 独立行政法人等」の双方が経由機関となる手続である場合に選択します。
  - 4-2 独立行政法人等又は地方等: 「2 独立行政法人等」「3 地方等」の双方が経由機関となる手続である場合に選択します。
  - 4-3 国又は地方等: 「1 国」「3 地方等」の双方が経由機関となる手続である場合に選択します。
  - 4-4 国、独立行政法人等又は地方等: 「1 国」「2 独立行政法人等」「3 地方等」のいずれもが経由機関となる手続である場合に選択します。
  - 5 国民等: 事業を行う立場以外の個人を指します。個人事業主は含みません。
  - 6 民間事業者等: 事業を行う立場の者を指します。個人事業主を含みます。
  - 7 国民等、民間事業者等: 「5 国民等」「6 民間事業者等」の双方が経由機関となる手続である場合に選択します。
  desc: 手続実施に際し、法令の規定に基づき特定の機関を経由する必要がある場合の経由機関の種別。
  csv_col_index: 9
  name: 経由機関
- role: attr
  desc: 独立行政法人等の名称。手続主体・受け手・経由機関に独立行政法人等が含まれる場合に記載。全ての独立行政法人等が対象の場合は「全独立行政法人等」。
  csv_col_index: 10
  name: 独立行政法人等の名称
- role: dim
  codelist:
  - 1 自治事務
  - 2 第1号法定受託事務
  - 3 第2号法定受託事務
  - 4 地方の事務でない
  desc: 手続を地方公共団体が行う場合の事務の区分。手続主体または受け手が「地方等」を含む手続が対象。
  csv_col_index: 11
  name: 事務区分
- role: dim
  desc: 府省共通手続かどうか。○＝全府省共通、●＝一部の府省で共通、×＝非共通。
  csv_col_index: 12
  name: 府省共通手続
- role: attr
  multi_value: true
  desc: 手続を実施する府省。府省共通手続の場合、回答のあった実施府省庁を全て記載。フェーズ2調査項目。
  csv_col_index: 13
  name: 実施府省庁
- role: dim
  codelist:
  - 1 実施済
  - 2 未実施
  - 3 適用除外
  - 4 その他
  - 5 一部実施済: 府省共通手続において一部の実施府省庁がオンライン化実施済の場合
  desc: 手続のオンライン実施状況。府省共通手続において一部の実施府省庁がオンライン化実施済の場合「5 一部実施済」。フェーズ2調査項目。
  csv_col_index: 14
  name: オンライン化の実施状況
- role: attr
  codelist:
  - 0 オンライン化実施予定
  - 1 制度改正が必要であり、制度改正のための時間確保が困難
  - 2 制度改正が必要であり、制度改正の業務上の優先順位が高くない
  - 3 電子化に必要なシステムが省庁内に備わっていない
  - 4 一部の必要書類の原本が紙であり、電子化してもオンライン処理が完結しない
  - 5 性質上、電子化すべきでない
  - 6 オンライン化の費用対効果が小さい又は不明
  - 7 上記に該当しない
  multi_value: true
  desc: オンライン化の実施予定及び検討時の懸念点。フェーズ2調査項目。府省共通手続の場合、実施府省庁の回答を全て並べている。
  csv_col_index: 15
  name: オンライン化の実施予定及び検討時の懸念点
- role: attr
  codelist:
  - 1 2024年度
  - 2 2025年度
  - 3 2026年度
  - 4 2027年度
  - 5 2028年度
  - 6 2029年度
  - 7 2030年度以降
  desc: オンライン化の実施予定年度。懸念点が「0 オンライン化実施予定」の手続が対象。府省共通手続で実施時期が異なる場合、最も近い年度を選択の上「以降」を追記。
  csv_col_index: 16
  name: オンライン化実施時期
- role: attr
  multi_value: true
  desc: 申請等における本人確認手法（複数選択可）。手続類型が「1 申請等」かつオンライン化が「2 未実施」「3 適用除外」「4 その他」の手続が対象。
  csv_col_index: 17
  name: 申請等における本人確認手法
- role: attr
  codelist:
  - 1 手数料等無し
  - 2 手数料等有り
  desc: 手続実施に必要な手数料等の有無。手続類型が「1 申請等」の手続が対象。
  csv_col_index: 18
  name: 手数料等の納付有無
- role: attr
  multi_value: true
  desc: 手数料等の納付方法（オフライン5種・オンライン6種から全て選択）。手続類型が「1 申請等」かつ「2 手数料等有り」の手続が対象。
  csv_col_index: 19
  name: 手数料等の納付方法
- role: attr
  codelist:
  - 1 減免措置有り
  - 2 減免措置無し
  desc: オンラインで手続を行う場合の手数料等の減免措置の有無。手数料等有りかつオンラインでの納付方法を選択した手続が対象。
  csv_col_index: 20
  name: 手数料等のオンライン納付時の優遇措置
- role: attr
  desc: オンラインで行う場合の標準的な処理期間。手続類型が「1 申請等」かつオンライン化が「1 実施済」の手続が対象。府省共通手続の場合、実施府省庁の回答範囲を記載。
  csv_col_index: 21
  name: 処理期間(オンライン)
- role: attr
  desc: 非オンラインで行う場合の標準的な処理期間。手続類型が「1 申請等」の手続が対象。府省共通手続の場合、実施府省庁の回答範囲を記載。
  csv_col_index: 22
  name: 処理期間(非オンライン)
- role: dim
  desc: 手続主体から受け手に対する申請等に係るシステム名（申請システム、受付システム等）。手続類型が「1 申請等」かつオンライン化が「1 実施済」もしくは懸念点が「0 オンライン化実施予定」の手続が対象。
  csv_col_index: 23
  name: 情報システム(申請)
- role: dim
  desc: 申請等を受けた後の事務処理に係るシステム名。府省共通手続の場合、実施府省庁の回答を全て並べている。
  csv_col_index: 24
  name: 情報システム(事務処理)
- role: measure
  data_type: integer
  desc: 令和5年度の年間の全手続件数。原則有効数字2桁以上、一部試算値を含む。地方等が実施する手続はサンプル自治体からの試算値。
  notes:
  - 件数は有効数字2桁以上の概数であり、一部試算値を含む。
  - 地方等が実施する手続はサンプル自治体からの試算値を含む。
  csv_col_index: 25
  name: 総手続件数
- role: measure
  data_type: integer
  desc: 令和5年度のオンラインで手続を実施した件数。オンライン化が「1 実施済」の手続が対象。件数は原則有効数字2桁以上、一部試算値を含む。
  notes:
  - null（欠損）は「件数不明」を意味する。0 は基本的に「オンライン手続なし」だが、地方等で件数集計が困難な一部の手続では 0 と記録されている場合がある。
  - 件数は有効数字1〜2桁程度の概数であり、一部試算値を含む。
  csv_col_index: 26
  name: オンライン手続件数
- role: measure
  data_type: integer
  desc: 令和5年度のオンライン以外の方法で手続を行った件数。件数は原則有効数字2桁以上、一部試算値を含む。
  notes:
  - 件数は有効数字1〜2桁程度の概数であり、一部試算値を含む。
  csv_col_index: 27
  name: 非オンライン手続件数
- role: attr
  multi_value: true
  desc: 申請書等の記入に際し、入力が必須となる典型的な項目（複数選択可）。マイナンバー、法人番号、各種保険番号、住所、資本金等。手続類型が「1 申請等」の手続が対象。
  csv_col_index: 28
  name: 申請書等に記載させる情報
- role: attr
  multi_value: true
  desc: 申請時に提出が必須となる典型的な書類（複数選択可）。住民票、戸籍、登記事項証明書、印鑑登録証明書、所得証明書等。手続類型が「1 申請等」の手続が対象。
  csv_col_index: 29
  name: 申請時に添付させる書類
- role: attr
  codelist:
  - 1 撤廃・省略済
  - 2 撤廃・省略予定
  - 3 撤廃・省略不可
  - 4 その他
  desc: 添付書類等の提出に係る撤廃/省略の状況。手続類型が「1 申請等」かつ添付書類の選択がある手続が対象。
  csv_col_index: 30
  name: 添付書類等提出の撤廃/省略状況
- role: attr
  codelist:
  - 0 電子・原紙を選択可能
  - 1 電子での提出のみ
  - 2 原紙での提出のみ
  - 3 一部電子、一部原紙での提出
  - 4 その他
  multi_value: true
  desc: 添付書類等の提出方法（電子のみ、原紙のみ、選択可能等）。撤廃/省略状況が「2〜4」の手続が対象。
  csv_col_index: 31
  name: 添付書類等の提出方法
- role: attr
  codelist:
  - 1 電子署名は必要ない
  - 2 一部の書類で電子署名が必要
  - 3 全ての書類で電子署名が必要
  desc: 添付書類等の提出に際し電子署名が必要かどうか。提出方法が「1 電子での提出のみ」の手続が対象。
  csv_col_index: 32
  name: 添付書類等への電子署名
- role: attr
  codelist:
  - 0 規定はない
  - 1 法令の規定
  - 2 告示等の規定
  - 3 システムの仕様
  - 4 その他
  desc: 添付書類等の提出方法及び添付形式等が規定されている文書の種類。撤廃/省略状況が「2〜4」の手続が対象。
  csv_col_index: 33
  name: 添付形式等が定められた規定
- role: attr
  multi_value: true
  desc: 個人のライフイベント（複数選択可）。妊娠、出生・こども、引越し、就職・転職、結婚・離婚、医療・健康、税金、年金の受給、死亡・相続等。
  csv_col_index: 34
  name: 手続が行われるイベント(個人)
- role: attr
  multi_value: true
  desc: 法人のライフイベント（複数選択可）。法人の設立、情報変更・役員変更、職員の採用・退職、入札・契約、事務所の新設・移転、法人の合併・分割等。
  csv_col_index: 35
  name: 手続が行われるイベント(法人)
- role: attr
  codelist:
  - 士業が介在しない
  - 弁護士
  - 行政書士
  - 税理士
  - 社会保険労務士
  - 弁理士
  - 海事代理士
  - 司法書士
  - 医療系職種
  - 公認会計士
  - 土地家屋調査士
  - 中小企業診断士
  - その他
  multi_value: true
  desc: 代理で申請等が可能な士業（複数選択可）。弁護士、司法書士、行政書士、税理士、社会保険労務士等。手続類型が「1 申請等」の手続が対象。
  csv_col_index: 36
  name: 申請に関連する士業
- role: attr
  codelist: auto_split
  multi_value: true
  desc: 申請の提出先機関。手続類型が「1 申請等」かつ受け手が「1 国」〜「4-4 国、独立行政法人等又は地方等」の手続が対象。（受け手が独立行政法人等の場合は対象外）
  csv_col_index: 37
  name: 申請を提出する機関
computed_measures:
- name: オンライン率
  mode: count_where
  condition_field: オンライン化の実施状況
  condition_values:
  - 1 実施済
  desc: オンライン化実施済の手続種類数 / 全手続種類数
generic_values:
- その他
