# yaml-language-server: $schema=../dataset-v1.schema.json
schema_version: "1"
title: 行政手続等の棚卸調査結果（令和7年度）
publisher: デジタル庁 (Digital Agency of Japan)
id_field: 手続ID
source:
  url: https://www.digital.go.jp/resources/procedures-survey-results
  # 配布ページ上のファイルを名前パターンで探す。直リンクを記録しないのは、
  # 改訂のたびに日付とパス中のハッシュが変わりリンクが腐るため。
  # 令和7年度から命名規則が `procedures_survey_result`（アンダースコア・単数形）に
  # 変わった。次年度以降も同じ規則が使われた場合に他年度のファイルを誤って拾わない
  # よう、公開年（2026）で限定している。年をまたぐ改訂で一致しなくなったときは、
  # このパターンを更新するか `apcli add procedures-survey-r7 --csv <ファイル>` で取り込む。
  asset_pattern: '2026\d{4}_procedures_survey_result_outline_02\.(xlsx|csv)$'
  csv_filename: 20260826_procedures_survey_result_outline_02.xlsx
  csv_header_rows: 2
  note: 調査時点は令和7年11月1日（一部それ以降の情報を含む）。件数フィールドは令和6年度の値。令和6年度調査とは列構成（法令番号なし、実施府省庁が単一値化し府省共通手続分は別列、関連条項号・関連する根拠法令・各種補足の追加で38列から46列に）と一部のコード値（府省共通手続の記号、オンライン化の実施状況の「5 一部実施済」なし）が異なる。
as_of_date: '2025-11-01'
published_at: '2026-08-26'
data_file: data.parquet
fields:
- role: id
  desc: 手続を一意に識別するID。令和6年度調査と共通の体系。
  csv_col_index: 0
  name: 手続ID
- role: dim
  codelist: auto
  desc: 手続が規定されている法令（の条文）を所管する府省庁。
  csv_col_index: 1
  name: 所管府省庁
- role: attr
  desc: 手続の名称。
  csv_col_index: 2
  name: 手続名
- role: dim
  codelist: auto
  desc: 手続の根拠法令の正式名称。令和7年度調査には「法令番号」の項目はない。
  csv_col_index: 3
  name: 法令名
- role: attr
  desc: 手続が規定されている条、項、号の番号。複数ある場合は主となる条項号番号のみ。
  csv_col_index: 4
  name: 根拠条項号
- role: attr
  desc: 「根拠条項号」以外に当該手続が規定されている条項号がある場合に記載。
  csv_col_index: 5
  name: 関連条項号
- role: attr
  desc: 「法令名」以外に当該手続が規定されている根拠法令がある場合に記載。
  csv_col_index: 6
  name: 関連する根拠法令
- role: dim
  codelist:
  - 1 申請等: 申請、届出その他の法令の規定に基づき行政機関等に対して行われる通知
  - 2-1 申請等に基づく処分通知等: 上記1の申請等に基づき、処分の通知その他の法令の規定により行政機関等が行う通知
  - 2-2 申請等に基づかない処分通知等: 上記1の申請等に基づかない処分の通知その他の法令の規定により行政機関等が行う通知
  - 2-3 交付等（民間手続）: 処分の通知その他の法令の規定に基づき民間事業者等が行う交付、提出、提供
  - 3 縦覧等: 書面等又は電磁的記録を、縦覧若しくは閲覧に供すること又は謄写させること
  - 4 作成・保存等: 書面等若しくは電磁的記録を作成、記載、記録、調製又は保存すること
  desc: 手続の類型。申請等、処分通知等（申請に基づく/基づかない）、交付等（民間手続）、縦覧等、作成・保存等に分類。
  csv_col_index: 7
  name: 手続類型
- role: dim
  codelist:
  - 1 国: 国の行政機関を指します。
  - 2 独立行政法人等: 独立行政法人、特殊法人、認可法人、指定法人等を指します。ただし、地方公共団体の機関は「地方等」に含みます。
  - 3 地方等: 地方公共団体とその機関（地方公共団体の独立行政法人等を含み、議会を除く。）を指します。
  - 4-1 国又は独立行政法人等: 「1 国」「2 独立行政法人等」の双方が主体となる手続である場合に選択します。
  - 4-2 独立行政法人等又は地方等: 「2 独立行政法人等」「3 地方等」の双方が主体となる手続である場合に選択します。
  - 4-3 国又は地方等: 「1 国」「3 地方等」の双方が主体となる手続である場合に選択します。
  - 4-4 国、独立行政法人等又は地方等: 「1 国」「2 独立行政法人等」「3 地方等」のいずれもが主体となる手続である場合に選択します。
  - 5 国民等: 事業を行う立場以外の個人を指します。個人事業主は含みません。日本国籍を有しない個人を含みます。
  - 6 民間事業者等: 事業を行う立場の者を指します。個人事業主を含みます。
  - 7 国民等、民間事業者等: 「5 国民等」「6 民間事業者等」の双方が主体となる手続である場合に選択します。
  desc: 手続を行う主体。国、独立行政法人等、地方等、国民等、民間事業者等、及びその組合せから選択。
  csv_col_index: 8
  name: 手続主体
- role: dim
  codelist:
  - 1 国: 国の行政機関を指します。
  - 2 独立行政法人等: 独立行政法人、特殊法人、認可法人、指定法人等を指します。ただし、地方公共団体の機関は「地方等」に含みます。
  - 3 地方等: 地方公共団体とその機関（地方公共団体の独立行政法人等を含み、議会を除く。）を指します。
  - 4-1 国又は独立行政法人等: 「1 国」「2 独立行政法人等」の双方が受け手となる手続である場合に選択します。
  - 4-2 独立行政法人等又は地方等: 「2 独立行政法人等」「3 地方等」の双方が受け手となる手続である場合に選択します。
  - 4-3 国又は地方等: 「1 国」「3 地方等」の双方が受け手となる手続である場合に選択します。
  - 4-4 国、独立行政法人等又は地方等: 「1 国」「2 独立行政法人等」「3 地方等」のいずれもが受け手となる手続である場合に選択します。
  - 5 国民等: 事業を行う立場以外の個人を指します。個人事業主は含みません。日本国籍を有しない個人を含みます。
  - 6 民間事業者等: 事業を行う立場の者を指します。個人事業主を含みます。
  - 7 国民等、民間事業者等: 「5 国民等」「6 民間事業者等」の双方が受け手となる手続である場合に選択します。
  desc: 最終的に手続を受ける者。手続類型が「1 申請等」「2-1〜2-3」の手続が対象。国、独立行政法人等、地方等、国民等、民間事業者等、及びその組合せから選択。
  csv_col_index: 9
  name: 手続の受け手
- role: attr
  desc: 手続類型・手続主体・手続の受け手についての補足（自由記述）。
  csv_col_index: 10
  name: 手続(類型、主体、受け手等)に関する補足
- role: attr
  codelist:
  - 1 国: 国の行政機関を指します。
  - 2 独立行政法人等: 独立行政法人、特殊法人、認可法人、指定法人等を指します。ただし、地方公共団体の機関は「地方等」に含みます。
  - 3 地方等: 地方公共団体とその機関（地方公共団体の独立行政法人等を含み、議会を除く。）を指します。
  - 4-1 国又は独立行政法人等: 「1 国」「2 独立行政法人等」の双方が経由機関となる手続である場合に選択します。
  - 4-2 独立行政法人等又は地方等: 「2 独立行政法人等」「3 地方等」の双方が経由機関となる手続である場合に選択します。
  - 4-3 国又は地方等: 「1 国」「3 地方等」の双方が経由機関となる手続である場合に選択します。
  - 4-4 国、独立行政法人等又は地方等: 「1 国」「2 独立行政法人等」「3 地方等」のいずれもが経由機関となる手続である場合に選択します。
  - 5 国民等: 事業を行う立場以外の個人を指します。個人事業主は含みません。日本国籍を有しない個人を含みます。
  - 6 民間事業者等: 事業を行う立場の者を指します。個人事業主を含みます。
  - 7 国民等、民間事業者等: 「5 国民等」「6 民間事業者等」の双方が経由機関となる手続である場合に選択します。
  desc: 手続実施に際し、法令の規定に基づき特定の機関を経由する必要がある場合の経由機関の種別。
  csv_col_index: 11
  name: 経由機関
- role: attr
  desc: 独立行政法人等の名称。手続主体・受け手・経由機関に独立行政法人等が含まれる場合に記載。全ての独立行政法人等が対象の場合は「全独立行政法人等」。
  csv_col_index: 12
  name: 独立行政法人等の名称
- role: dim
  codelist:
  - 1 自治事務
  - 2 第1号法定受託事務
  - 3 第2号法定受託事務
  - 4 地方の事務でない
  desc: 手続を地方公共団体が行う場合の事務の区分。手続主体または受け手が「地方等」を含む手続が対象。
  csv_col_index: 13
  name: 事務区分
- role: dim
  codelist:
  - 〇（全府省庁）: 手続の根拠法令の所管府省庁及びその他全府省が共通して行う手続
  - ●（一部の府省庁）: 所管府省庁及びその他の一部の府省が共通して行う手続
  - ✕（府省庁共通手続でない）: 上記以外
  desc: 府省共通手続かどうか。値の完全一致検索・フィルタでは上記のデータ実値を用いる。
  notes:
  - データの実値は「〇（全府省庁）」「●（一部の府省庁）」「✕（府省庁共通手続でない）」だが、令和7年度の調査結果解説資料の本文は「○（全府省）」「●（一部の府省）」「×（府省共通手続でない）」と表記しており、記号（〇 U+3007 と ○ U+25CB、✕ U+2715 と × U+00D7）も「府省庁」「府省」の語も一致しない。
  - 令和6年度調査のデータは解説資料と同じ「○（全府省）」「●（一部の府省）」「×（府省共通手続でない）」。年度をまたぐ完全一致検索では年度ごとの表記を用いる。
  csv_col_index: 14
  name: 府省共通手続
- role: dim
  codelist: auto
  desc: 手続を実施する府省庁（単一値）。令和6年度調査の「実施府省庁」は府省共通手続の実施府省庁を全て並べた複数値だったが、令和7年度は本列が単一値となり、府省共通手続の実施府省庁は「実施府省庁(府省共通手続)」に分かれた。年度比較では列の意味が異なる。
  csv_col_index: 15
  name: 実施府省庁
- role: attr
  codelist: auto_split
  multi_value: true
  desc: 府省共通手続の場合に、手続を実施する府省庁。複数の府省庁はセミコロン区切り。
  notes:
  - 「●（一部の府省庁）」3,829 件のうち 3,827 件、「〇（全府省庁）」1,806 件のうち 928 件に値がある一方、「✕（府省庁共通手続でない）」70,637 件にも 157 件だけ値がある。全体の fill_rate は 0.06。
  - セミコロン以外の区切り（読点・中黒・「＋」・全角セミコロン等）で複数府省庁を 1 つの値に並べた行が 429 件あり、explode / group_by では分割されず 1 値として集計される。
  - 分割後の値には調査結果解説資料の府省庁一覧（26 択）にない表記が 46 種・延べ 437 件含まれる（「公害等調整委員会」「原子力規制庁」「海上保安庁」「閣府」等）。
  csv_col_index: 16
  name: 実施府省庁(府省共通手続)
- role: dim
  codelist:
  - 1 実施済
  - 2 未実施
  - 3 適用除外
  - 4 その他
  desc: 手続のオンライン実施状況。「4 その他」の詳細は「オンライン化の実施状況に関する補足」に記載。令和6年度調査にあった「5 一部実施済」の区分は令和7年度調査にはない。
  notes:
  - 令和6年度調査の「5 一部実施済」に相当する区分はない。年度間で「1 実施済」等の件数を比較する際は区分の違いに注意。
  csv_col_index: 17
  name: オンライン化の実施状況
- role: attr
  codelist:
  - 0 オンライン化実施予定
  - 1 制度改正が必要であり、制度改正のための時間確保が困難
  - 2 制度改正が必要であり、制度改正の業務上の優先順位が高くない
  - 3 電子化に必要なシステムが省庁内に備わっていない
  - 4 一部の必要書類の原本が紙であり、電子化してもオンライン処理が完結しない
  - 5 性質上、電子化すべきでない
  - 6 オンライン化の費用対効果が小さい又は不明
  - 7 上記に該当しない（理由を記載）
  desc: オンライン化の実施予定及び検討時の懸念点。「7 上記に該当しない（理由を記載）」の理由は「オンライン化の実施状況に関する補足」に記載。
  notes:
  - 令和6年度調査では府省共通手続について実施府省庁の回答を全て並べた複数値だったが、令和7年度は単一値（データにセミコロン区切りの値はない）。
  csv_col_index: 18
  name: オンライン化の実施予定及び検討時の懸念点
- role: attr
  desc: オンライン化の実施状況が「4 その他」、または懸念点が「7 上記に該当しない（理由を記載）」の手続について、その詳細（自由記述）。
  csv_col_index: 19
  name: オンライン化の実施状況に関する補足
- role: attr
  codelist:
  - 1 2024年度
  - 2 2025年度
  - 3 2026年度
  - 4 2027年度
  - 5 2028年度
  - 6 2029年度
  - 7 2030年度以降
  desc: オンライン化の実施予定年度。オンライン化の実施予定及び検討時の懸念点が「0 オンライン化実施予定」の手続が対象。府省共通手続で実施時期が異なる場合、最も近い年度を選択の上「以降」を追記。
  notes:
  - 非 null 4,308 件のうち 7 件は選択肢以外の自由記述が入っている。
  csv_col_index: 20
  name: オンライン化実施時期
- role: attr
  codelist:
  - 1 押印＋印鑑証明: 押印に加えて、印鑑登録証明書を添えることによって本人確認を行う場合
  - 2 押印: 押印によって本人確認を行う場合（印鑑登録証明書を添えることは不要である場合）
  - 3 署名: 署名によって本人確認を行う場合
  - 4 本人確認書類の提示・提出: 本人確認書類の提示や提出によって本人確認を行う場合
  - 5 その他: 上記以外の手法によって本人確認を行う場合
  - 6 本人確認不要: 本人確認が不要である場合
  desc: 非オンラインの場合の申請等における本人確認手法。手続類型が「1 申請等」かつオンライン化の実施状況が「2 未実施」「3 適用除外」「4 その他」の手続が対象。
  notes:
  - 令和6年度調査では府省共通手続について実施府省庁の回答を全て並べた複数値だったが、令和7年度は単一値（データにセミコロン区切りの値はない）。
  csv_col_index: 21
  name: 申請等における本人確認手法
- role: attr
  codelist:
  - 1 手数料等無し
  - 2 手数料等有り
  desc: 手続実施に際して必要となる手数料等の有無。手続類型が「1 申請等」の手続が対象。「手数料等」とは、行政機関等が特定の者のために特別の役務を提供する場合に当該役務の受益者からその対価として費用を徴収するもの全般を指し、必ずしも名称が「手数料」であるものだけに限らない。
  csv_col_index: 22
  name: 手数料等の納付有無
- role: attr
  codelist:
  - 1-1 行政機関の窓口
  - 1-2 銀行の窓口
  - 1-3 ペイジー(ATM)
  - 1-4 コンビニ等代理施設
  - 1-5 その他オフラインでの納付方法
  - 2-1 ペイジー(ネットバンキング)
  - 2-2 ペイジー(ダイレクト方式)
  - 2-3 クレジットカード払い
  - 2-4 二次元コード決済
  - 2-5 インターネットバンキング
  - 2-6 その他オンラインでの納付方法
  multi_value: true
  desc: 手数料等の納付方法（オフライン5種「1-x」・オンライン6種「2-x」から全て選択）。手続類型が「1 申請等」かつ「2 手数料等有り」の手続が対象。
  csv_col_index: 23
  name: 手数料等の納付方法
- role: attr
  desc: 納付方法が「1-5 その他オフラインでの納付方法」「2-6 その他オンラインでの納付方法」の手続について、その内容（自由記述）。
  csv_col_index: 24
  name: 手数料等に関する補足
- role: attr
  codelist:
  - 1 減免措置有り
  - 2 減免措置無し
  desc: オンラインで手続を行う場合の手数料等の減免措置の有無。手数料等有りかつオンラインでの納付方法を選択した手続が対象。
  notes:
  - 解説資料上の対象はオンラインでの納付方法（2-1〜2-6）を選んだ手続だが、実データでは非 null 1,825 件のうちオンラインでの納付方法が記載されているのは 1,358 件で、467 件は対象外の手続。
  csv_col_index: 25
  name: 手数料等のオンライン納付時の優遇措置
- role: attr
  desc: オンラインで行う場合の標準的な処理期間（自由記述）。手続類型が「1 申請等」かつオンライン化が「1 実施済」の手続が対象。
  csv_col_index: 26
  name: 処理期間(オンライン)
- role: attr
  desc: 非オンラインで行う場合の標準的な処理期間（自由記述）。手続類型が「1 申請等」の手続が対象。
  csv_col_index: 27
  name: 処理期間(非オンライン)
- role: dim
  desc: 手続主体から受け手に対する申請等に係るシステム名（申請システム、受付システム等）。手続類型が「1 申請等」かつオンライン化が「1 実施済」もしくは懸念点が「0 オンライン化実施予定」の手続が対象。
  csv_col_index: 28
  name: 情報システム(申請)
- role: attr
  desc: 「情報システム(申請)」に記載した以外の申請システムがある場合、その名称。
